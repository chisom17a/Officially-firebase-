<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chiearn Hub – Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Poppins, sans-serif;
      background: linear-gradient(135deg, #e8f0ff, #ffffff);
      margin: 0;
    }
    .signup-section {
      max-width: 440px;
      margin: 80px auto;
      background: #fff;
      padding: 40px;
      border-radius: 18px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.1);
    }
    input, select, button {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      background: #60a5fa;
      border: none;
      cursor: pointer;
      font-weight: 600;
      color: #fff;
    }
    .loader {
      display: none;
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #ccc;
      border-top: 4px solid #60a5fa;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 10px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    a {
      font-size: 13px;
      display: block;
      margin-top: 10px;
      text-decoration: none;
      color: #555;
    }
  </style>
</head>

<body>

<section class="signup-section">
  <h2>Create Account</h2>

  <form id="signupForm">
    <input id="username" placeholder="Username" required />
    <input id="email" type="email" placeholder="Email" required />
    <input id="phone" placeholder="Phone" required />
    <input id="referral" placeholder="Referral (optional)" />
    <input id="password" type="password" placeholder="Password" required />
    <input id="repeatPassword" type="password" placeholder="Repeat Password" required />

    <select id="model" required>
      <option value="">Select role</option>
      <option value="Earner">Earner</option>
      <option value="Advertiser">Advertiser</option>
    </select>

    <button id="signupBtn" type="submit">Sign Up</button>

    <div class="loader" id="loader">
      <div class="spinner"></div>
      Creating account, please wait...
    </div>

    <a href="login.html">Already have an account</a>
    <a href="index.html">Learn more</a>
  </form>
</section>

<script>
  // Auto-fill referral from link
  const params = new URLSearchParams(window.location.search);
  const ref = params.get("ref");
  if (ref) {
    const refInput = document.getElementById("referral");
    refInput.value = ref.toLowerCase();
    refInput.readOnly = true;
  }
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import {
  getFirestore, doc, setDoc, serverTimestamp,
  collection, query, where, getDocs, runTransaction
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* 🔹 YOUR FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCqHY59fXbXWTOtki5cBT-qryPVNerzToM",
  authDomain: "chiearnhubvercel.firebaseapp.com",
  projectId: "chiearnhubvercel",
  storageBucket: "chiearnhubvercel.firebasestorage.app",
  messagingSenderId: "1069350970788",
  appId: "1:1069350970788:web:b6fb81b6c397344d118d31"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("signupForm");
const btn = document.getElementById("signupBtn");
const loader = document.getElementById("loader");

function showLoading() {
  btn.style.display = "none";
  loader.style.display = "block";
}

function hideLoading() {
  btn.style.display = "block";
  loader.style.display = "none";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = document.getElementById("username").value.trim().toLowerCase();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const phone = document.getElementById("phone").value.trim();
  const referral = document.getElementById("referral").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  const repeatPassword = document.getElementById("repeatPassword").value;
  const model = document.getElementById("model").value;

  if (password !== repeatPassword) {
    alert("Passwords do not match");
    return;
  }

  showLoading();

  try {
    /* 1️⃣ CREATE AUTH USER FIRST */
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    const uid = cred.user.uid;

    /* 2️⃣ CREATE USER DOCUMENT */
    const newUserRef = doc(db, "users", uid);

    await setDoc(newUserRef, {
      username,
      email,
      phone,
      model,
      referredBy: referral || null,
      balance: 0,
      status: "pending",
      referralCount: 0,
      createdAt: serverTimestamp()
    });

    /* 3️⃣ HANDLE REFERRAL SAFELY */
    if (referral) {
      const q = query(collection(db, "users"), where("username", "==", referral));
      const snap = await getDocs(q);

      if (!snap.empty) {
        const refDoc = snap.docs[0];
        const refRef = doc(db, "users", refDoc.id);

        await runTransaction(db, async (transaction) => {
          const refSnap = await transaction.get(refRef);
          const currentCount = refSnap.data().referralCount || 0;
          transaction.update(refRef, { referralCount: currentCount + 1 });
        });
      }
    }

    alert("Account created successfully!");
    window.location.href = "login.html";

  } catch (err) {
    alert(err.message || err);
    hideLoading();
  }
});
</script>

</body>
</html>
