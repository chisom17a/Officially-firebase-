<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Task Review</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{font-family:Arial;background:#f4f6f8;margin:0;padding:0;}
    header{background:#111;color:white;padding:15px;text-align:center;font-size:20px;}
    .container{max-width:1000px;margin:20px auto;padding:10px;}
    .card{
      background:white;
      padding:15px;
      border-radius:10px;
      margin-bottom:15px;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
    }
    .row{margin:5px 0;font-size:15px;}
    .btn{
      padding:10px 14px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-weight:bold;
      margin-right:5px;
    }
    .approve{background:#28a745;color:white;}
    .reject{background:#dc3545;color:white;}
    .view{background:#0d6efd;color:white;}

    .loading{
      display:none;
      text-align:center;
      margin-top:10px;
    }
    .spinner{
      width:35px;
      height:35px;
      border:4px solid #eee;
      border-top:4px solid #111;
      border-radius:50%;
      animation:spin 1s linear infinite;
      margin:auto;
    }
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

    /* Modal */
    .modal{
      position:fixed;
      top:0;left:0;right:0;bottom:0;
      background:rgba(0,0,0,.6);
      display:none;
      align-items:center;
      justify-content:center;
    }
    .modal img{
      max-width:90%;
      max-height:90%;
      border-radius:10px;
      background:white;
      padding:10px;
    }
  </style>
</head>
<body>

<header>🛠 Admin Task Review</header>

<div class="container" id="list">Loading...</div>

<div class="modal" id="imgModal" onclick="this.style.display='none'">
  <img id="modalImg">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import {
  getFirestore, collection, query, where, getDocs,
  doc, getDoc, updateDoc, runTransaction, increment
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCajnnfI9oxVDv4B44tiMsIgTDApt1rFjc",
  authDomain: "chiearnhub-5ba9e.firebaseapp.com",
  projectId: "chiearnhub-5ba9e",
  storageBucket: "chiearnhub-5ba9e.firebasestorage.app",
  messagingSenderId: "332513744974",
  appId: "1:332513744974:web:bfb84a79d0dbbb0057cb1f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const list = document.getElementById("list");

onAuthStateChanged(auth, async user=>{
  if(!user) return location.href="login.html";

  const us = await getDoc(doc(db,"users",user.uid));
  if(!us.exists() || us.data().model !== "Admin"){
    alert("Access denied");
    return location.href="index.html";
  }

  loadSubmissions();
});

async function loadSubmissions(){
  list.innerHTML = "Loading...";

  const q = query(collection(db,"submissions"), where("status","==","pending"));
  const snap = await getDocs(q);

  if(snap.empty){
    list.innerHTML = "<b>No pending submissions</b>";
    return;
  }

  list.innerHTML = "";

  for(const d of snap.docs){
    const s = d.data();

    const userSnap = await getDoc(doc(db,"users", s.userId));
    const taskSnap = await getDoc(doc(db,"availabletasks", s.taskId));

    const user = userSnap.data();
    const task = taskSnap.data();

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="row"><b>User:</b> ${user.username}</div>
      <div class="row"><b>Email:</b> ${user.email}</div>
      <div class="row"><b>Text Proof:</b> ${s.textProof || "None"}</div>
      <div class="row"><b>Task Price:</b> ₦${task.earnerprice}</div>
      <div class="row"><b>Remaining:</b> ${task.remaining}</div>

      <div style="margin-top:10px">
        <button class="btn view">View Image Proof</button>
        <button class="btn approve">Approve</button>
        <button class="btn reject">Reject</button>
      </div>

      <div class="loading">
        <div class="spinner"></div>
        Processing...
      </div>
    `;

    const viewBtn = div.querySelector(".view");
    const approveBtn = div.querySelector(".approve");
    const rejectBtn = div.querySelector(".reject");
    const loading = div.querySelector(".loading");

    viewBtn.onclick = ()=>{
      document.getElementById("modalImg").src = s.imageProof;
      document.getElementById("imgModal").style.display="flex";
    };

    approveBtn.onclick = async ()=>{
      if(!confirm("Approve and credit user?")) return;

      approveBtn.style.display = rejectBtn.style.display = viewBtn.style.display = "none";
      loading.style.display = "block";

      try{
        await runTransaction(db, async (t)=>{
          const userRef = doc(db,"users",s.userId);
          const subRef = doc(db,"submissions",d.id);

          const u = await t.get(userRef);

          const newBal = (u.data().balance || 0) + task.earnerprice;

          t.update(userRef,{ balance:newBal });
          t.update(subRef,{ status:"approved", reviewedAt: Date.now() });
        });

        alert("Approved!");
        div.remove();
      }catch(e){
        alert("Error: "+e.message);
      }
    };

    rejectBtn.onclick = async ()=>{
      const reason = prompt("Enter rejection reason:");
      if(!reason) return;

      if(!confirm("Reject this submission?")) return;

      approveBtn.style.display = rejectBtn.style.display = viewBtn.style.display = "none";
      loading.style.display = "block";

      try{
        await runTransaction(db, async (t)=>{
          t.update(doc(db,"submissions",d.id),{
            status:"rejected",
            reason: reason,
            reviewedAt: Date.now()
          });

          t.update(doc(db,"availabletasks", s.taskId),{
            remaining: increment(1)
          });
        });

        alert("Rejected and task refunded.");
        div.remove();
      }catch(e){
        alert("Error: "+e.message);
      }
    };

    list.appendChild(div);
  }
}
</script>

</body>
</html>
