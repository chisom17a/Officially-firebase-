<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin – Task Review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial;background:#f4f6f8;margin:0}
header{background:#111;color:#fff;padding:15px;text-align:center;font-size:20px}
.container{max-width:1000px;margin:20px auto;padding:10px}
.card{
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08)
}
.row{margin:6px 0;font-size:14px}
.guide{
  background:#f9fafb;
  border-left:4px solid #0d6efd;
  padding:10px;
  margin-top:10px;
  font-size:14px
}
.btn{
  padding:10px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  margin-right:6px;
}
.approve{background:#16a34a;color:#fff}
.reject{background:#dc2626;color:#fff}
.view{background:#0d6efd;color:#fff}

.loading{display:none;margin-top:10px;font-size:14px}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center
}
.modal img{
  max-width:90%;
  max-height:90%;
  background:#fff;
  padding:10px;
  border-radius:8px
}
</style>
</head>

<body>

<header>🛠 Admin Task Review</header>

<div class="container" id="list">Loading…</div>

<div class="modal" id="imgModal" onclick="this.style.display='none'">
  <img id="modalImg">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import {
  getFirestore, collection, query, where, getDocs,
  doc, getDoc, runTransaction, increment
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔐 chiearnhubvercel Firebase config */
const firebaseConfig = {
  apiKey: "AIzaSyCajnnfI9oxVDv4B44tiMsIgTDApt1rFjc",
  authDomain: "chiearnhub-5ba9e.firebaseapp.com",
  projectId: "chiearnhub-5ba9e",
  storageBucket: "chiearnhub-5ba9e.firebasestorage.app",
  messagingSenderId: "332513744974",
  appId: "1:332513744974:web:bfb84a79d0dbbb0057cb1f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const list = document.getElementById("list");

/* 🔐 AUTH + ADMIN CHECK */
onAuthStateChanged(auth, async user=>{
  if(!user) return location.href="login.html";

  const userSnap = await getDoc(doc(db,"users",user.uid));
  if(!userSnap.exists() || userSnap.data().model !== "Admin"){
    alert("Access denied");
    return location.href="index.html";
  }

  loadSubmissions();
});

/* 📥 LOAD SUBMISSIONS */
async function loadSubmissions(){
  list.innerHTML = "Loading…";

  const q = query(
    collection(db,"submissions"),
    where("status","==","pending")
  );

  const snap = await getDocs(q);

  if(snap.empty){
    list.innerHTML = "<b>No pending submissions</b>";
    return;
  }

  list.innerHTML = "";

  for(const docSnap of snap.docs){
    const s = docSnap.data();

    const taskSnap = await getDoc(doc(db,"availabletasks",s.taskId));
    if(!taskSnap.exists()) continue;

    const task = taskSnap.data();

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="row"><b>User:</b> ${s.username} (${s.userEmail})</div>
      <div class="row"><b>Reward:</b> ₦${s.reward}</div>
      <div class="row"><b>Proof Title:</b> ${s.proofTitle || "-"}</div>
      <div class="row"><b>Text Proof:</b> ${s.proofText || "-"}</div>

      <div class="guide">
        <b>Task Guide:</b><br>
        ${task.guide || "No guide provided"}
      </div>

      <div style="margin-top:10px">
        <button class="btn view">View Image</button>
        <button class="btn approve">Approve</button>
        <button class="btn reject">Reject</button>
      </div>

      <div class="loading">Processing…</div>
    `;

    const viewBtn = card.querySelector(".view");
    const approveBtn = card.querySelector(".approve");
    const rejectBtn = card.querySelector(".reject");
    const loading = card.querySelector(".loading");

    viewBtn.onclick = ()=>{
      document.getElementById("modalImg").src = s.proofImage;
      document.getElementById("imgModal").style.display="flex";
    };

    approveBtn.onclick = async ()=>{
      if(!confirm("Approve & credit user?")) return;

      toggle(false);

      try{
        await runTransaction(db, async t=>{
          const userRef = doc(db,"users",s.userId);
          const subRef = doc(db,"submissions",docSnap.id);

          const u = await t.get(userRef);
          t.update(userRef,{
            balance:(u.data().balance||0)+s.reward
          });
          t.update(subRef,{
            status:"approved",
            reviewedAt:Date.now()
          });
        });

        card.remove();
      }catch(e){
        alert(e.message);
        toggle(true);
      }
    };

    rejectBtn.onclick = async ()=>{
      const reason = prompt("Reason for rejection?");
      if(!reason) return;

      toggle(false);

      try{
        await runTransaction(db, async t=>{
          t.update(doc(db,"submissions",docSnap.id),{
            status:"rejected",
            reason,
            reviewedAt:Date.now()
          });
          t.update(doc(db,"availabletasks",s.taskId),{
            remaining: increment(1)
          });
        });

        card.remove();
      }catch(e){
        alert(e.message);
        toggle(true);
      }
    };

    function toggle(show){
      approveBtn.style.display =
      rejectBtn.style.display =
      viewBtn.style.display = show ? "inline-block":"none";
      loading.style.display = show ? "none":"block";
    }

    list.appendChild(card);
  }
}
</script>

</body>
</html>
