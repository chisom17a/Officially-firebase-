<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Task Review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f5f7fb;margin:0;padding:0}
header{background:#111;color:#fff;padding:15px;text-align:center;font-size:20px}
.container{max-width:900px;margin:auto;padding:15px}
.card{background:#fff;margin:15px 0;padding:15px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.btn{padding:10px 14px;border:none;border-radius:6px;color:#fff;font-weight:bold;cursor:pointer}
.approve{background:#28a745}
.reject{background:#dc3545}
.loader{display:none;text-align:center}
.spinner{width:30px;height:30px;border:4px solid #ddd;border-top:4px solid #111;border-radius:50%;animation:spin 1s linear infinite;margin:auto}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
img{max-width:100%;border-radius:8px}
</style>
</head>
<body>

<header>Admin Task Review</header>

<div class="container" id="list">
Loading...
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { 
  getAuth, 
  onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { 
  getFirestore, 
  collection, 
  query, 
  where, 
  getDocs, 
  doc, 
  runTransaction,
  serverTimestamp 
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCajnnfI9oxVDv4B44tiMsIgTDApt1rFjc",
  authDomain: "chiearnhub-5ba9e.firebaseapp.com",
  projectId: "chiearnhub-5ba9e",
  storageBucket: "chiearnhub-5ba9e.firebasestorage.app",
  messagingSenderId: "332513744974",
  appId: "1:332513744974:web:bfb84a79d0dbbb0057cb1f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 🔐 AUTH CHECK */
onAuthStateChanged(auth, async (user)=>{
  if(!user) return location.href="login.html";

  const usnap = await (await import("https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js"))
    .getDoc(doc(db,"users",user.uid));

  if(!usnap.exists() || usnap.data().model !== "Admin"){
    alert("Access denied");
    return location.href="dashboard.html";
  }

  loadSubmissions();
});

/* 📥 LOAD PENDING SUBMISSIONS */
async function loadSubmissions(){
  const q = query(collection(db,"submissions"), where("status","==","pending"));
  const snap = await getDocs(q);

  const list = document.getElementById("list");
  list.innerHTML = "";

  if(snap.empty){
    list.innerHTML = "<p>No pending submissions</p>";
    return;
  }

  snap.forEach(docu=>{
    const d = docu.data();
    const div = document.createElement("div");
    div.className="card";
    div.innerHTML = `
      <b>User:</b> ${d.userId}<br>
      <b>Task:</b> ${d.taskId}<br>
      <b>Proof:</b><br>
      ${d.proofUrl ? `<img src="${d.proofUrl}">` : `<pre>${d.proofText||""}</pre>`}
      <br><br>

      <div id="btns_${docu.id}">
        <button class="btn approve" onclick="approve('${docu.id}')">Approve</button>
        <button class="btn reject" onclick="rejectTask('${docu.id}')">Reject</button>
      </div>

      <div class="loader" id="load_${docu.id}">
        <div class="spinner"></div> Processing...
      </div>
    `;
    list.appendChild(div);
  });
}

/* ✅ APPROVE */
window.approve = async function(id){
  hideButtons(id);

  try{
    const subRef = doc(db,"submissions",id);

    await runTransaction(db, async (t)=>{
      const subSnap = await t.get(subRef);
      if(!subSnap.exists()) throw "Submission missing";

      const sub = subSnap.data();

      const userRef = doc(db,"users",sub.userId);
      const taskRef = doc(db,"availabletasks",sub.taskId);

      const userSnap = await t.get(userRef);

      const reward = sub.reward || 0;
      const newBal = (userSnap.data().balance||0) + reward;

      t.update(userRef, { balance: newBal });
      t.update(subRef, { status:"approved", reviewedAt: serverTimestamp() });
    });

    alert("Approved & credited");
    loadSubmissions();

  }catch(e){
    alert("Error: "+e);
  }
}

/* ❌ REJECT */
window.rejectTask = async function(id){
  const reason = prompt("Why are you rejecting this task?");
  if(!reason) return;

  hideButtons(id);

  try{
    const subRef = doc(db,"submissions",id);

    await runTransaction(db, async (t)=>{
      const subSnap = await t.get(subRef);
      const sub = subSnap.data();

      const taskRef = doc(db,"availabletasks",sub.taskId);
      const taskSnap = await t.get(taskRef);

      t.update(taskRef,{
        remaining: (taskSnap.data().remaining||0) + 1
      });

      t.update(subRef,{
        status:"rejected",
        rejectReason: reason,
        reviewedAt: serverTimestamp()
      });
    });

    alert("Rejected & task refunded");
    loadSubmissions();

  }catch(e){
    alert("Error: "+e);
  }
}

/* 🎯 UI LOCK */
function hideButtons(id){
  document.getElementById("btns_"+id).style.display="none";
  document.getElementById("load_"+id).style.display="block";
}
</script>

</body>
</html>
