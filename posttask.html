<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post Task - Chiearn Hub</title>
<style>
:root{
  --primary:#0d6efd;
  --bg:#f4f7fa;
  --white:#fff;
}
*{box-sizing:border-box;font-family:Poppins,Inter,sans-serif}
body{margin:0;background:var(--bg)}

header{
  background:#fff;
  padding:15px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:600;
}

.balance{
  background:#eef2ff;
  padding:8px 15px;
  border-radius:20px;
  color:#1d4ed8;
}

.container{
  max-width:600px;
  margin:30px auto;
  background:#fff;
  padding:25px;
  border-radius:12px;
}

input,select,button{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  background:var(--primary);
  color:#fff;
  border:none;
  font-weight:600;
  cursor:pointer;
}

button.secondary{background:#64748b}
button.danger{background:#dc2626}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:15px;
}

.price-box{
  background:#f1f5f9;
  padding:12px;
  border-radius:8px;
  font-weight:600;
}

#loader{
  display:none;
  text-align:center;
  padding:15px;
  font-weight:600;
}

.spinner{
  width:30px;
  height:30px;
  border:4px solid #ddd;
  border-top:4px solid #0d6efd;
  border-radius:50%;
  margin:10px auto;
  animation:spin 1s linear infinite;
}

#authSpinner{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.7);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

#authSpinner .spinner{
  width:45px;
  height:45px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}
</style>
</head>
<body>

<div id="authSpinner">
  <div class="spinner"></div>
</div>

<header>
  <span>Post a Task</span>
  <div class="balance" id="balance">₦0</div>
</header>

<div class="container">
  <h3>Create Task</h3>

  <label>Platform</label>
  <select id="platform"></select>

  <label>Task Type</label>
  <select id="type"></select>

  <div class="price-box" id="priceBox">Price per person: ₦0</div>

  <label>Task Link</label>
  <input type="url" id="link">

  <label>Proof Title</label>
  <input type="text" id="proofTitle">

  <label>Task Guide</label>
  <input type="text" id="taskguide">

  <label>Amount (People)</label>
  <input type="number" id="amount" min="10">

  <button onclick="calculateTotal()">Calculate Total</button>
  <div class="price-box" id="totalBox">Total: ₦0</div>

  <div id="loader">
    <div class="spinner"></div>
    Submitting task, please wait...
  </div>

  <div class="actions" id="actions">
    <button class="secondary" onclick="location.href='advertiser.html'">Home</button>
    <button class="secondary" onclick="location.href='deposit.html'">Deposit</button>
    <button class="danger" onclick="location.href='advertiser.html'">Cancel</button>
    <button id="submitBtn" onclick="submitTask()">Proceed</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, runTransaction,
  collection, serverTimestamp, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCqHY59fXbXWTOtki5cBT-qryPVNerzToM",
  authDomain: "chiearnhubvercel.firebaseapp.com",
  projectId: "chiearnhubvercel",
  storageBucket: "chiearnhubvercel.firebasestorage.app",
  messagingSenderId: "1069350970788",
  appId: "1:1069350970788:web:b6fb81b6c397344d118d31"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const authSpinner = document.getElementById("authSpinner");
const balanceDisplay = document.getElementById("balance");

const amountInput = document.getElementById("amount");
const platformInput = document.getElementById("platform");
const typeInput = document.getElementById("type");
const linkInput = document.getElementById("link");
const proofTitleInput = document.getElementById("proofTitle");
const taskGuideInput = document.getElementById("taskguide");
const loader = document.getElementById("loader");
const actions = document.getElementById("actions");
const totalBox = document.getElementById("totalBox");
const priceBox = document.getElementById("priceBox");

let currentUser;
let userData = {};
let selectedPrice = 0;

/* TASK TYPES */
const taskTypes = {
  WhatsApp:[{n:"Group Join/channel",p:30},{n:"Status Post",p:40},{n:"Channel Join and Like",p:40},{n:"Channel React No Join",p:15},{n:"Message Sending",p:40}],
  Telegram:[{n:"Group Join",p:20},{n:"Channel Follow",p:20},{n:"Simple Bot",p:35},{n:"Complex Bot",p:50},{n:"Web Bot",p:50}],
  Instagram:[{n:"Follow",p:30},{n:"Post Like",p:7},{n:"Comment",p:8},{n:"Post View",p:6},{n:"Live Engagement",p:20}],
  Facebook:[{n:"Like Page / Follow",p:15},{n:"Group Join",p:30},{n:"Post Like",p:7},{n:"Comment",p:20},{n:"Post Share",p:15},{n:"Video View",p:10},{n:"Post On Facebook",p:20},{n:"Page / Business Review",p:20}],
  Twitter:[{n:"Follow",p:15},{n:"Retweet",p:15},{n:"Comment",p:10},{n:"Like",p:8},{n:"Vote",p:20},{n:"Post On X",p:30}],
  TikTok:[{n:"Follow",p:15},{n:"Like",p:8},{n:"Comment",p:9},{n:"Video View",p:20},{n:"Repost",p:20},{n:"Add To Favourite",p:10},{n:"Use Sound",p:50}],
  YouTube:[{n:"Subscribe",p:25},{n:"Like Video",p:5},{n:"Comment",p:12},{n:"Video View",p:20},{n:"Video Share",p:20}],
  Website:[{n:"Interact With Website",p:15},{n:"Simple Sign Up",p:35},{n:"Blog Comment",p:15},{n:"Review",p:20},{n:"Complex Sign Up",p:50}],
  Gmail:[{n:"Email Creation",p:70},{n:"Email Sell",p:100}],
  Audiomack:[{n:"Stream Music",p:35},{n:"Music Comment",p:15},{n:"Music Like",p:10},{n:"Add To Favourite",p:15},{n:"Page Follow",p:20}],
  Boomplay:[{n:"Stream Music",p:35},{n:"Music Comment",p:15},{n:"Music Like",p:10},{n:"Add To Favourite",p:15},{n:"Page Follow",p:20}],
  Spotify:[{n:"Stream Music",p:40},{n:"Music Like",p:25},{n:"Add To Playlist",p:25},{n:"Page Follow",p:20}],
  Threads:[{n:"Post Like",p:19},{n:"Comment",p:15},{n:"Follow",p:15},{n:"Repost",p:20}]
};

/* INIT PLATFORM */
platformInput.innerHTML = `<option value="">Select Platform</option>` +
Object.keys(taskTypes).map(p=>`<option>${p}</option>`).join("");

platformInput.onchange = () => {
  typeInput.innerHTML = "<option value=''>Select Task Type</option>";
  selectedPrice = 0;
  priceBox.textContent = "Price per person: ₦0";
  totalBox.textContent = "Total: ₦0";

  taskTypes[platformInput.value]?.forEach(t=>{
    const o = document.createElement("option");
    o.textContent = t.n;
    o.dataset.price = t.p;
    typeInput.appendChild(o);
  });
};

typeInput.onchange = () => {
  selectedPrice = Number(typeInput.selectedOptions[0].dataset.price || 0);
  priceBox.textContent = `Price per person: ₦${selectedPrice}`;
  calculateTotal();
};

function calculateTotal() {
  const qty = Number(amountInput.value || 0);
  totalBox.textContent = qty >= 10 ? `Total: ₦${qty * selectedPrice}` : "Total: ₦0";
}

/* AUTH CHECK */
onAuthStateChanged(auth, async (user) => {
  if (!user) return location.href = "login.html";

  const snap = await getDoc(doc(db, "users", user.uid));
  if (!snap.exists() || (snap.data().model || "").toLowerCase() !== "advertiser") {
    alert("Unauthorized access");
    location.href = "login.html";
    return;
  }

  currentUser = user;
  userData = snap.data();

  onSnapshot(doc(db,"users",user.uid), s=>{
    balanceDisplay.textContent = "₦" + ((s.data().balance || 0).toLocaleString());
    userData.balance = s.data().balance || 0;
  });

  authSpinner.style.display = "none";
});

/* SUBMIT TASK */
async function submitTask() {
  const qty = Number(amountInput.value || 0);
  const total = qty * selectedPrice;

  if (!platformInput.value || !typeInput.value || !linkInput.value || !proofTitleInput.value || qty < 10) {
    alert("Complete all fields correctly");
    return;
  }

  if ((userData.balance || 0) < total) {
    alert("Insufficient balance");
    location.href = "deposit.html";
    return;
  }

  actions.style.display = "none";
  loader.style.display = "block";

  try {
    const userRef = doc(db,"users",currentUser.uid);
    const tasksRef = collection(db,"tasks");

    await runTransaction(db, async (transaction) => {
      const userSnap = await transaction.get(userRef);
      const balance = userSnap.data().balance || 0;

      if (balance < total) throw "Insufficient balance";

      transaction.update(userRef, { balance: balance - total });

      const newTaskRef = doc(tasksRef);
      transaction.set(newTaskRef, {
        userId: currentUser.uid,
        platform: platformInput.value,
        type: typeInput.value,
        link: linkInput.value,
        proofTitle: proofTitleInput.value,
        guide: taskGuideInput.value || "",
        quantity: qty,
        remaining: qty,
        price: selectedPrice,
        total: total,
        status: "pending",
        createdAt: serverTimestamp()
      });
    });

    alert("✅ Task submitted for admin approval.");
    location.href = "advertiser.html";

  } catch (err) {
    console.error(err);
    alert("❌ Failed to submit task: " + err);
    loader.style.display = "none";
    actions.style.display = "grid";
  }
}

window.submitTask = submitTask;
window.calculateTotal = calculateTotal;
</script>

</body>
</html>
