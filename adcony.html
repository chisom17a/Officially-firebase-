<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Task Review - Chiearn Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#2563eb;
  --success:#16a34a;
  --danger:#dc2626;
  --bg:#f4f7fa;
  --white:#fff;
  --shadow:rgba(0,0,0,.1)
}
*{box-sizing:border-box;font-family:Inter,sans-serif}
body{margin:0;background:var(--bg)}
header{
  background:var(--white);
  padding:15px 25px;
  font-size:22px;
  font-weight:700;
  color:var(--primary);
  box-shadow:0 2px 8px var(--shadow)
}
.container{max-width:1000px;margin:auto;padding:25px}
.card{
  background:var(--white);
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 12px var(--shadow);
  margin-bottom:20px
}
.meta{font-size:14px;color:#555;margin-bottom:10px}
.guide{
  background:#f1f5f9;
  padding:12px;
  border-radius:8px;
  margin:12px 0;
  font-size:14px
}
.actions{display:flex;gap:12px;margin-top:15px}
button{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  font-weight:600;
  cursor:pointer
}
.approve{background:var(--success);color:#fff}
.reject{background:var(--danger);color:#fff}
</style>
</head>

<body>

<header>Admin – Task Submissions</header>
<div class="container" id="taskContainer">Checking authorization...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import {
  getFirestore, collection, query, where, onSnapshot,
  doc, getDoc, updateDoc, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* 🔥 CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCqHY59fXbXWTOtki5cBT-qryPVNerzToM",
  authDomain: "chiearnhubvercel.firebaseapp.com",
  projectId: "chiearnhubvercel",
  storageBucket: "chiearnhubvercel.firebasestorage.app",
  messagingSenderId: "1069350970788",
  appId: "1:1069350970788:web:b6fb81b6c397344d118d31"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const container = document.getElementById("taskContainer");

/* ================= PRICE TABLE ================= */
const earnerPrices = {
  WhatsApp:{ "Group Join":20,"Channel Follow":15 },
  Instagram:{ "Follow":20,"Like":10 },
  Telegram:{ "Group Join":18 },
  YouTube:{ "Subscribe":20 }
};

/* ================= LOCAL STORAGE CHECK ================= */
const storedUser = JSON.parse(localStorage.getItem("currentUser"));
if (!storedUser || storedUser.model !== "Admin") {
  alert("Please login as admin");
  location.href = "login.html";
}

/* ================= AUTH + ADMIN VERIFY ================= */
onAuthStateChanged(auth, async (user)=>{
  if(!user || user.uid !== storedUser.uid){
    localStorage.removeItem("currentUser");
    location.href="login.html";
    return;
  }

  const snap = await getDoc(doc(db,"users",user.uid));
  if(!snap.exists() || snap.data().model !== "Admin"){
    localStorage.removeItem("currentUser");
    alert("Unauthorized access");
    location.href="login.html";
    return;
  }

  loadTasks();
});

/* ================= LOAD TASKS ================= */
function loadTasks(){
  const q = query(collection(db,"tasks"), where("status","==","pending"));

  onSnapshot(q, snap=>{
    container.innerHTML="";

    if(snap.empty){
      container.innerHTML="<p>No pending tasks.</p>";
      return;
    }

    snap.forEach(d=>{
      const t = d.data();
      const id = d.id;

      const div = document.createElement("div");
      div.className="card";
      div.innerHTML=`
        <h3>${t.platform} – ${t.type}</h3>

        <div class="meta">
          <b>Advertiser UID:</b> ${t.userId}<br>
          <b>Advertiser Price:</b> ₦${t.price}<br>
          <b>Quantity:</b> ${t.quantity}<br>
          <b>Total:</b> ₦${t.total}
        </div>

        <!-- ✅ TASK GUIDE ADDED -->
        <div class="guide">
          <b>Task Guide</b><br>
          ${t.guide || "No guide provided"}
        </div>

        <div class="actions">
          <button class="approve">Approve</button>
          <button class="reject">Reject</button>
        </div>
      `;

      div.querySelector(".approve").onclick=()=>approveTask(id,t);
      div.querySelector(".reject").onclick=()=>rejectTask(id,t);

      container.appendChild(div);
    });
  });
}

/* ================= APPROVE ================= */
async function approveTask(taskId, task){
  if(!confirm("Approve this task?")) return;

  const earnerPrice =
    earnerPrices?.[task.platform]?.[task.type] ||
    Math.floor(task.price * 0.6);

  await addDoc(collection(db,"availabletasks"),{
    sourceTaskId: taskId,
    posterId: task.userId,
    platform: task.platform,
    type: task.type,
    link: task.link,
    proofTitle: task.proofTitle,

    /* ✅ SAVE TASK GUIDE */
    guide: task.guide || "",

    advertiserPrice: task.price,
    earnerPrice,
    quantity: task.quantity,
    remaining: task.quantity,
    status:"active",
    createdAt: serverTimestamp()
  });

  await updateDoc(doc(db,"tasks",taskId),{
    status:"approved",
    approvedAt: serverTimestamp()
  });

  alert("Task approved & published");
}

/* ================= REJECT ================= */
async function rejectTask(taskId, task){
  const reason = prompt("Reason for rejection?");
  if(!reason) return;

  const userRef = doc(db,"users",task.userId);
  const snap = await getDoc(userRef);

  if(snap.exists()){
    await updateDoc(userRef,{
      balance:(snap.data().balance||0) + task.total
    });
  }

  await updateDoc(doc(db,"tasks",taskId),{
    status:"rejected",
    rejectionReason:reason,
    rejectedAt:serverTimestamp()
  });

  alert("Task rejected & refunded");
}
</script>

</body>
</html>
