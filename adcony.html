<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Task Review - Chiearn Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#2563eb;
  --success:#16a34a;
  --danger:#dc2626;
  --bg:#f4f7fa;
  --white:#fff;
  --shadow:rgba(0,0,0,.1)
}
*{box-sizing:border-box;font-family:Inter,sans-serif}
body{margin:0;background:var(--bg)}
header{
  background:var(--white);
  padding:15px 25px;
  font-size:22px;
  font-weight:700;
  color:var(--primary);
  box-shadow:0 2px 8px var(--shadow)
}
.container{max-width:1000px;margin:auto;padding:25px}
.card{
  background:var(--white);
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 12px var(--shadow);
  margin-bottom:20px
}
.meta{font-size:14px;color:#555;margin-bottom:10px}
.actions{display:flex;gap:12px;margin-top:15px}
button{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  font-weight:600;
  cursor:pointer
}
.approve{background:var(--success);color:#fff}
.reject{background:var(--danger);color:#fff}
</style>
</head>

<body>

<header>Admin – Task Submissions</header>
<div class="container" id="taskContainer">Loading...</div>

<script type="module">
/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import {
  getFirestore, collection, query, where, onSnapshot,
  doc, getDoc, updateDoc, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* 🔥 CHIEARNHUB VERCEL CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCajnnfI9oxVDv4B44tiMsIgTDApt1rFjc",
  authDomain: "chiearnhub-5ba9e.firebaseapp.com",
  projectId: "chiearnhub-5ba9e",
  storageBucket: "chiearnhub-5ba9e.firebasestorage.app",
  messagingSenderId: "332513744974",
  appId: "1:332513744974:web:bfb84a79d0dbbb0057cb1f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const container = document.getElementById("taskContainer");

/* ================= EARNER PRICE TABLE ================= */
const earnerPrices = {
  WhatsApp:{ "Group Join":20,"Channel Follow":15 },
  Instagram:{ "Follow":20,"Like":10 },
  Telegram:{ "Group Join":18 },
  YouTube:{ "Subscribe":20 }
};

/* ================= AUTH + ADMIN CHECK ================= */
onAuthStateChanged(auth, async (user)=>{
  const stored = JSON.parse(localStorage.getItem("currentUser"));

  if(!user || !stored || stored.uid !== user.uid){
    localStorage.removeItem("currentUser");
    return location.href="login.html";
  }

  const snap = await getDoc(doc(db,"users",user.uid));
  if(!snap.exists() || snap.data().model !== "Admin"){
    alert("Unauthorized");
    await signOut(auth);
    localStorage.removeItem("currentUser");
    return location.href="login.html";
  }

  loadTasks();
});

/* ================= LOAD PENDING TASKS ================= */
function loadTasks(){
  const q = query(collection(db,"tasks"), where("status","==","pending"));
  onSnapshot(q, snap=>{
    container.innerHTML="";

    if(snap.empty){
      container.innerHTML="<p>No pending task submissions.</p>";
      return;
    }

    snap.forEach(docSnap=>{
      const t = docSnap.data();
      const id = docSnap.id;

      const div = document.createElement("div");
      div.className="card";
      div.innerHTML=`
        <h3>${t.platform} – ${t.type}</h3>
        <div class="meta">
          <b>Advertiser:</b> ${t.userId}<br>
          <b>Advertiser Price:</b> ₦${t.price}<br>
          <b>Quantity:</b> ${t.quantity}<br>
          <b>Total:</b> ₦${t.total}
        </div>
        <div class="actions">
          <button class="approve">Approve</button>
          <button class="reject">Reject</button>
        </div>
      `;

      div.querySelector(".approve").onclick=()=>approveTask(id,t);
      div.querySelector(".reject").onclick=()=>rejectTask(id,t);

      container.appendChild(div);
    });
  });
}

/* ================= APPROVE TASK ================= */
async function approveTask(taskId, task){
  if(!confirm("Approve this task?")) return;

  const earnerPrice =
    earnerPrices?.[task.platform]?.[task.type] ||
    Math.floor(task.price * 0.6);

  await addDoc(collection(db,"availabletasks"),{
    sourceTaskId: taskId,
    posterId: task.userId,
    platform: task.platform,
    type: task.type,
    link: task.link,
    proofTitle: task.proofTitle,
    advertiserPrice: task.price,
    earnerPrice,
    quantity: task.quantity,
    remaining: task.quantity,
    status:"active",
    createdAt: serverTimestamp()
  });

  await updateDoc(doc(db,"tasks",taskId),{
    status:"approved",
    approvedAt: serverTimestamp()
  });

  alert("Task approved and published");
}

/* ================= REJECT TASK ================= */
async function rejectTask(taskId, task){
  const reason = prompt("Reason for rejection?");
  if(!reason) return;

  const userRef = doc(db,"users",task.userId);
  const userSnap = await getDoc(userRef);

  if(userSnap.exists()){
    await updateDoc(userRef,{
      balance:(userSnap.data().balance||0) + task.total
    });
  }

  await updateDoc(doc(db,"tasks",taskId),{
    status:"rejected",
    rejectionReason:reason,
    rejectedAt:serverTimestamp()
  });

  alert("Task rejected and advertiser refunded");
}
</script>

</body>
</html>
