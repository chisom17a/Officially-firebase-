<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – User Balance Control</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#2563eb;
  --danger:#dc2626;
  --success:#16a34a;
  --bg:#f4f7fa;
  --white:#fff;
}
*{box-sizing:border-box;font-family:Inter}
body{margin:0;background:var(--bg)}

header{
  background:var(--white);
  padding:15px 25px;
  font-size:22px;
  font-weight:700;
  color:var(--primary);
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.container{
  max-width:500px;
  margin:50px auto;
  background:var(--white);
  padding:25px;
  border-radius:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}

label{font-weight:600;display:block;margin-top:15px}

input,select{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:15px;
}

button{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:none;
  border-radius:8px;
  background:var(--primary);
  color:#fff;
  font-weight:600;
  font-size:16px;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.secondary{background:#475569}
button:hover:not(:disabled){opacity:.9}

.message{
  margin-top:15px;
  font-weight:600;
  text-align:center;
}
.success{color:var(--success)}
.error{color:var(--danger)}
</style>
</head>

<body>

<header>Admin – User Balance Control</header>

<div class="container">
  <label>User Email</label>
  <input type="email" id="email" placeholder="Enter user email">

  <label>Action</label>
  <select id="action">
    <option value="">Select Action</option>
    <option value="increase">Increase Balance</option>
    <option value="decrease">Decrease Balance</option>
  </select>

  <label>Amount (₦)</label>
  <input type="number" id="amount" min="1" placeholder="Enter amount">

  <button id="processBtn" disabled>Proceed</button>
  <button class="secondary" onclick="location.href='adminpanel.html'">Home</button>

  <div id="msg" class="message"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  doc,
  getDoc,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCqHY59fXbXWTOtki5cBT-qryPVNerzToM",
  authDomain: "chiearnhubvercel.firebaseapp.com",
  projectId: "chiearnhubvercel",
  storageBucket: "chiearnhubvercel.firebasestorage.app",
  messagingSenderId: "1069350970788",
  appId: "1:1069350970788:web:b6fb81b6c397344d118d31"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const processBtn = document.getElementById("processBtn");
const msg = document.getElementById("msg");

let adminUID = null;

/* ===== AUTH + ADMIN VERIFY (FROM FIRESTORE ONLY) ===== */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = "login.html";
    return;
  }

  const adminRef = doc(db, "users", user.uid);
  const adminSnap = await getDoc(adminRef);

  if (!adminSnap.exists() || adminSnap.data().model !== "Admin") {
    alert("Unauthorized access");
    location.href = "login.html";
    return;
  }

  adminUID = user.uid;
  processBtn.disabled = false;
});

/* ===== PROCESS BALANCE ===== */
processBtn.onclick = async () => {
  msg.textContent = "";
  msg.className = "message";

  const email = document.getElementById("email").value.trim().toLowerCase();
  const action = document.getElementById("action").value;
  const amount = Number(document.getElementById("amount").value);

  if (!email || !action || amount <= 0) {
    msg.textContent = "Please fill all fields correctly.";
    msg.classList.add("error");
    return;
  }

  try {
    const q = query(collection(db, "users"), where("email", "==", email));
    const snap = await getDocs(q);

    if (snap.empty) {
      msg.textContent = "User not found.";
      msg.classList.add("error");
      return;
    }

    const userDocSnap = snap.docs[0];

    /* ❌ Prevent admin editing own balance by mistake */
    if (userDocSnap.id === adminUID) {
      msg.textContent = "You cannot modify your own balance.";
      msg.classList.add("error");
      return;
    }

    const userRef = doc(db, "users", userDocSnap.id);
    const currentBalance = userDocSnap.data().balance ?? 0;

    if (action === "decrease" && currentBalance < amount) {
      msg.textContent = `Insufficient balance. User has ₦${currentBalance}`;
      msg.classList.add("error");
      return;
    }

    await updateDoc(userRef, {
      balance: increment(action === "increase" ? amount : -amount)
    });

    msg.textContent = "Balance updated successfully.";
    msg.classList.add("success");
    document.getElementById("amount").value = "";

  } catch (error) {
    console.error("Firestore error:", error.code, error.message);
    msg.textContent = `${error.code}: ${error.message}`;
    msg.classList.add("error");
  }
};
</script>

</body>
</html>
