<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earner Profile - Chiearn Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --primary:#0d6efd;
  --bg:#f4f7fa;
  --white:#fff;
}
*{box-sizing:border-box;font-family:'Inter',sans-serif}
body{margin:0;background:var(--bg)}
header{background:#fff;padding:15px 25px;font-size:22px;font-weight:600;color:var(--primary)}
.container{max-width:900px;margin:auto;padding:25px}
.profile-section{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px}
.profile-pic{width:120px;height:120px;border-radius:50%;object-fit:cover}
input{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ccc}
button{padding:10px 15px;border:none;border-radius:8px;background:var(--primary);color:#fff;cursor:pointer}
.toast{
  position:fixed;bottom:20px;right:20px;
  background:#111;color:#fff;
  padding:12px 18px;border-radius:8px;
  opacity:0;transition:.3s;
}
.toast.show{opacity:1}
.spinner{
  position:fixed;inset:0;
  background:rgba(255,255,255,.9);
  display:flex;align-items:center;justify-content:center;
  z-index:999;
}
.spinner::after{
  content:"";
  width:40px;height:40px;
  border:4px solid #ddd;
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>

<div id="spinner" class="spinner"></div>

<header>Chiearn Hub – Earner Profile</header>

<div class="container">

<button onclick="location.href='dashboard.html'">← Back to Dashboard</button>

<div class="profile-section">
  <h3>User Info</h3>
  <img id="profilePic" class="profile-pic">
  <p><b>Username:</b> <span id="username"></span></p>
  <p><b>Email:</b> <span id="email"></span></p>
  <p><b>Balance:</b> ₦<span id="balance"></span></p>
  <p><b>Referral Count:</b> <span id="referralCount"></span></p>

  <label>Full Name</label>
  <input id="fullNameInput">
  <button onclick="saveFullName()">Save Full Name</button>

  <label>Change Profile Picture</label>
  <input type="file" id="picInput" accept="image/*">
  <button onclick="uploadPic()">Update Picture</button>
</div>

<div class="profile-section">
  <h3>Change Password</h3>
  <input type="password" id="currentPass" placeholder="Current password">
  <input type="password" id="newPass" placeholder="New password">
  <input type="password" id="confirmPass" placeholder="Confirm new password">
  <button onclick="changePassword()">Update Password</button>
</div>

</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getAuth,onAuthStateChanged,
  updatePassword,
  EmailAuthProvider,
  reauthenticateWithCredential
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import {
  getFirestore,
  doc,updateDoc,onSnapshot
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqHY59fXbXWTOtki5cBT-qryPVNerzToM",
  authDomain: "chiearnhubvercel.firebaseapp.com",
  projectId: "chiearnhubvercel",
  storageBucket: "chiearnhubvercel.firebasestorage.app",
  messagingSenderId: "1069350970788",
  appId: "1:1069350970788:web:b6fb81b6c397344d118d31"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const spinner = document.getElementById("spinner");
const toastBox = document.getElementById("toast");

function toast(msg){
  toastBox.innerText = msg;
  toastBox.classList.add("show");
  setTimeout(()=>toastBox.classList.remove("show"),2500);
}

/* 🔐 LOCAL STORAGE CHECK */
const cachedUID = localStorage.getItem("uid");
if(!cachedUID){
  location.href="login.html";
}

/* 🔥 AUTH CONFIRM */
let userRef,currentUser;

onAuthStateChanged(auth,user=>{
  if(!user){
    localStorage.removeItem("uid");
    location.href="login.html";
    return;
  }

  localStorage.setItem("uid",user.uid);
  currentUser=user;
  userRef=doc(db,"users",user.uid);

  onSnapshot(userRef,snap=>{
    if(!snap.exists()) return;
    const u=snap.data();

    username.innerText=u.username||"";
    email.innerText=u.email;
    balance.innerText=u.balance||0;
    referralCount.innerText=u.referralCount||0;
    profilePic.src=u.profilePic||"https://via.placeholder.com/120";
    fullNameInput.value=u.fullName||"";

    spinner.style.display="none";
  });
});

/* ✏️ FULL NAME */
window.saveFullName=async()=>{
  const name=fullNameInput.value.trim();
  if(!name) return toast("Full name required");
  await updateDoc(userRef,{fullName:name});
  toast("Full name updated");
};

/* 🔑 PASSWORD */
window.changePassword=async()=>{
  if(newPass.value!==confirmPass.value)
    return toast("Passwords do not match");

  const cred=EmailAuthProvider.credential(
    currentUser.email,currentPass.value
  );

  try{
    await reauthenticateWithCredential(currentUser,cred);
    await updatePassword(currentUser,newPass.value);
    toast("Password updated");
    currentPass.value=newPass.value=confirmPass.value="";
  }catch{
    toast("Current password incorrect");
  }
};

/* 🖼️ PROFILE PICTURE */
window.uploadPic=async()=>{
  const file=picInput.files[0];
  if(!file) return toast("Select an image");

  const fd=new FormData();
  fd.append("image",file);

  const res=await fetch(
    "https://api.imgbb.com/1/upload?key=fb44bf17871e5949e02fe80b4f56fa47",
    {method:"POST",body:fd}
  );

  const data=await res.json();
  await updateDoc(userRef,{profilePic:data.data.url});
  toast("Profile picture updated");
};
</script>

</body>
</html>
