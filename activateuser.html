<!DOCTYPE html>
<html>
<head>
  <title>Admin - Activation Requests</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body{font-family:Inter;background:#f4f7fa;padding:20px}
    .card{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px}
    img{max-width:100%;border-radius:8px}
    button{padding:10px 14px;border:none;border-radius:6px;color:#fff;cursor:pointer;margin-right:6px}
    .approve{background:#16a34a}
    .reject{background:#dc2626}
    .pending{color:#f59e0b;font-weight:bold}
  </style>
</head>
<body>

<h2>🛂 Activation Requests</h2>
<div id="list">Loading...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { 
  getFirestore, collection, query, where, getDocs, doc, updateDoc, serverTimestamp, getDoc 
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyCajnnfI9oxVDv4B44tiMsIgTDApt1rFjc",
  authDomain: "chiearnhub-5ba9e.firebaseapp.com",
  projectId: "chiearnhub-5ba9e",
  appId: "1:332513744974:web:bfb84a79d0dbbb0057cb1f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= AUTH CHECK ================= */
onAuthStateChanged(auth, async (user)=>{
  if(!user){
    location.href = "login.html";
    return;
  }

  const snap = await getDoc(doc(db,"users",user.uid));

  if(!snap.exists() || snap.data().model !== "Admin"){
    alert("Access denied");
    location.href = "index.html";
    return;
  }

  loadRequests();
});

/* ================= LOAD REQUESTS ================= */
async function loadRequests(){
  const q = query(
    collection(db,"activationRequests"),
    where("status","==","pending")
  );

  const snap = await getDocs(q);
  const list = document.getElementById("list");
  list.innerHTML = "";

  if(snap.empty){
    list.innerHTML = "No pending requests.";
    return;
  }

  snap.forEach(docSnap=>{
    const r = docSnap.data();

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <p><b>Email:</b> ${r.email}</p>
      <p><b>Sender:</b> ${r.senderName}</p>
      <p class="pending">Status: PENDING</p>
      <img src="${r.proofImage}" />

      <br><br>
      <button class="approve">Approve</button>
      <button class="reject">Reject</button>
    `;

    div.querySelector(".approve").onclick = () => approve(docSnap.id, r.uid);
    div.querySelector(".reject").onclick = () => rejectReq(docSnap.id, r.uid);

    list.appendChild(div);
  });
}

/* ================= APPROVE ================= */
async function approve(requestId, uid){
  if(!confirm("Approve this user?")) return;

  // 1. Update request
  await updateDoc(doc(db,"activationRequests",requestId),{
    status: "approved",
    reviewedAt: serverTimestamp()
  });

  // 2. Activate user
  await updateDoc(doc(db,"users",uid),{
    status: "active"
  });

  alert("✅ User activated");
  loadRequests();
}

/* ================= REJECT ================= */
async function rejectReq(requestId, uid){
  const reason = prompt("Enter rejection reason:");
  if(!reason) return alert("Rejection reason is required");

  // 1. Update request
  await updateDoc(doc(db,"activationRequests",requestId),{
    status: "rejected",
    rejectReason: reason,
    reviewedAt: serverTimestamp()
  });

  // 2. Update user
  await updateDoc(doc(db,"users",uid),{
    status: "rejected"
  });

  alert("❌ User rejected");
  loadRequests();
}
</script>

</body>
</html>
