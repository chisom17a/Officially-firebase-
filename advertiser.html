<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chiearn Hub - Advertiser Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    header {
      background: #0a5cff;
      color: #fff;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    nav {
      background: #fff;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-bottom: 1px solid #ddd;
    }

    nav a {
      text-decoration: none;
      color: #333;
      font-weight: bold;
      font-size: 14px;
    }

    .container {
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .value {
      font-size: 28px;
      font-weight: bold;
      margin: 10px 0;
    }

    .btn {
      padding: 10px 15px;
      border: none;
      background: #0a5cff;
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 5px;
      margin-top: 5px;
    }

    .btn.secondary {
      background: #555;
    }

    .referral input {
      width: 100%;
      padding: 8px;
      margin: 10px 0;
    }
  </style>
</head>

<body>

<header>Chiearn Hub - Advertiser Dashboard</header>

<nav>
  <a href="dashboard.html">🏠Dashboard</a>
  <a href="posttask.html">📝Post Task</a>
  <a href="deposit.html">💰Deposit</a>
  <a href="profile.html">👤Profile</a>
  <a href="#" onclick="logout()">🚪Logout</a>
</nav>

<div class="container">
  <h1>Advertiser Dashboard</h1>

  <div class="card">
    <h2>Available Balance</h2>
    <div class="value" id="balance">₦0</div>
    <button class="btn" onclick="location.href='posttask.html'">Post Task</button>
    <button class="btn secondary" onclick="location.href='deposit.html'">Deposit</button>
  </div>

  <div class="card referral">
    <h2>Referral Program</h2>
    <input type="text" id="refLink" readonly>
    <button class="btn" onclick="copyReferral()">Copy Link</button>
    <p>✔ 0.5% advertiser deposit</p>
    <p>✔ ₦500 per activated earner</p>
  </div>
</div>

<script>
  // 🔐 SESSION CHECK (NO AUTO LOGOUT)
  const user = JSON.parse(localStorage.getItem("user"));

  if (!user || user.model !== "Advertiser") {
    window.location.href = "login.html";
  }

  // 💰 LOAD BALANCE
  document.getElementById("balance").textContent = "₦" + (user.balance || 0);

  // 🔗 REFERRAL LINK
  document.getElementById("refLink").value =
    window.location.origin + "/register.html?ref=" + user.username;

  function copyReferral() {
    const refInput = document.getElementById("refLink");
    refInput.select();
    refInput.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(refInput.value);
    alert("Referral link copied!");
  }

  // 🚪 LOGOUT (ONLY WHEN CLICKED)
  function logout() {
    localStorage.removeItem("user");
    window.location.href = "login.html";
  }
</script>

</body>
</html>
