<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Chiearn Hub</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .card {
      background: #fff;
      color: #1e293b;
      padding: 35px;
      width: 100%;
      max-width: 400px;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    h2 {
      margin-bottom: 10px;
      text-align: center;
    }

    p {
      font-size: 14px;
      text-align: center;
      margin-bottom: 25px;
      color: #64748b;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      margin-bottom: 15px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .back a {
      color: #2563eb;
      text-decoration: none;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid #cbd5e1;
      border-top: 3px solid #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      text-align: center;
    }

    .success { color: #16a34a; }
    .error { color: #dc2626; }
  </style>
</head>

<body>

<div class="card">
  <h2>Forgot Password</h2>
  <p>Enter your registered email to receive a reset link</p>

  <input type="email" id="email" placeholder="Enter your email" required>

  <button id="resetBtn">
    <span id="btnText">Send Reset Link</span>
  </button>

  <div class="message" id="message"></div>

  <div class="back">
    <a href="login.html">← Back to Login</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getAuth,
  fetchSignInMethodsForEmail,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqHY59fXbXWTOtki5cBT-qryPVNerzToM",
  authDomain: "chiearnhubvercel.firebaseapp.com",
  projectId: "chiearnhubvercel",
  storageBucket: "chiearnhubvercel.firebasestorage.app",
  messagingSenderId: "1069350970788",
  appId: "1:1069350970788:web:b6fb81b6c397344d118d31"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const emailInput = document.getElementById("email");
const resetBtn = document.getElementById("resetBtn");
const message = document.getElementById("message");
const btnText = document.getElementById("btnText");

resetBtn.addEventListener("click", async () => {
  const email = emailInput.value.trim();
  message.textContent = "";

  if (!email) {
    message.textContent = "Please enter your email";
    message.className = "message error";
    return;
  }

  resetBtn.disabled = true;
  btnText.innerHTML = `<span class="spinner"></span>`;

  try {
    // 🔍 CHECK IF EMAIL EXISTS
    const methods = await fetchSignInMethodsForEmail(auth, email);

    if (methods.length === 0) {
      message.textContent = "No account found with this email";
      message.className = "message error";
      resetBtn.disabled = false;
      btnText.textContent = "Send Reset Link";
      return;
    }

    // 📧 SEND RESET EMAIL
    await sendPasswordResetEmail(auth, email);

    message.textContent =
      "Password reset email sent. Check your inbox or spam folder.";
    message.className = "message success";

  } catch (error) {
    message.textContent = error.message;
    message.className = "message error";
  }

  resetBtn.disabled = false;
  btnText.textContent = "Send Reset Link";
});
</script>

</body>
</html>
