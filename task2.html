<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chiearn Hub - Tasks list</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --primary:#0d6efd;
  --bg:#f4f7fa;
  --white:#fff;
}
*{box-sizing:border-box;font-family:Inter}
body{margin:0;background:var(--bg)}
header{background:#fff;padding:15px;font-weight:600}
.container{max-width:900px;margin:auto;padding:25px}
.task-row{
  display:grid;
  grid-template-columns:1fr 120px 120px;
  gap:10px;
  background:#fff;
  padding:15px;
  margin-bottom:10px;
  border-radius:10px;
  align-items:center;
}
.perform-btn{
  background:var(--primary);
  color:#fff;
  border:none;
  border-radius:6px;
  padding:8px;
  cursor:pointer;
}
.perform-btn:disabled{
  background:#94a3b8;
}
</style>
</head>

<body>

<header>Chiearn Hub</header>

<button onclick="location.href='earner.html'">Back to Home</button>

<div class="container">
  <h2>Available Tasks</h2>
  <div id="taskList">getting available tasks...</div>
</div>

<script type="module">
/* ================= FIREBASE (chiearnhubvercel) ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import {
  getFirestore, collection, query, where,
  onSnapshot, getDoc, doc
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* 🔥 CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCqHY59fXbXWTOtki5cBT-qryPVNerzToM",
  authDomain: "chiearnhubvercel.firebaseapp.com",
  projectId: "chiearnhubvercel",
  storageBucket: "chiearnhubvercel.firebasestorage.app",
  messagingSenderId: "1069350970788",
  appId: "1:1069350970788:web:b6fb81b6c397344d118d31"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const list = document.getElementById("taskList");

let currentUser;
let userData = {};
let completedTasks = new Set();

/* ================= LOCAL STORAGE CHECK ================= */
const storedUser = JSON.parse(localStorage.getItem("currentUser"));
if (!storedUser) {
  location.href = "login.html";
}

/* ================= AUTH ================= */
onAuthStateChanged(auth, async (user)=>{
  if(!user || user.uid !== storedUser.uid){
    localStorage.removeItem("currentUser");
    return location.href="login.html";
  }

  currentUser = user;

  const userSnap = await getDoc(doc(db,"users",user.uid));
  if(!userSnap.exists()){
    localStorage.removeItem("currentUser");
    return location.href="login.html";
  }

  userData = userSnap.data();

  /* ✅ Only earners */
  if(userData.model !== "Earner"){
    alert("Access denied");
    return location.href="login.html";
  }

  /* ✅ Must be activated */
  if(userData.status !== "active"){
    alert("Your account is not activated yet");
    return location.href="active.html";
  }

  loadMySubmissions();
});

/* ================= LOAD SUBMISSIONS ================= */
function loadMySubmissions(){
  const q = query(
    collection(db,"submissions"),
    where("userId","==",currentUser.uid)
  );

  onSnapshot(q, snap=>{
    completedTasks.clear();

    snap.forEach(docSnap=>{
      const s = docSnap.data();
      if(s.status !== "rejected"){
        completedTasks.add(s.taskId);
      }
    });

    loadTasks();
  });
}

/* ================= LOAD TASKS ================= */
function loadTasks(){
  const q = query(
    collection(db,"availabletasks"),
    where("status","==","active")
  );

  onSnapshot(q, snap=>{
    list.innerHTML = "";

    if(snap.empty){
      list.innerHTML = "<p>No tasks available at the moment.</p>";
      return;
    }

    let shown = 0;

    snap.forEach(docSnap=>{
      const t = docSnap.data();
      const id = docSnap.id;

      const remaining = t.remaining ?? 0;
      const price = t.earnerPrice ?? t.price ?? 0;

      if(remaining <= 0) return;
      if(completedTasks.has(id)) return;

      shown++;

      const row = document.createElement("div");
      row.className = "task-row";
      row.innerHTML = `
        <div>
          <b>${t.platform}</b> - ${t.type}<br>
          <small>${t.proofTitle || ""}</small>
        </div>
        <div>₦${price}</div>
        <button class="perform-btn">Perform</button>
      `;

      row.querySelector("button").onclick = ()=>{
        location.href = "task.html?id=" + id;
      };

      list.appendChild(row);
    });

    if(shown === 0){
      list.innerHTML = "<p>No tasks available for you right now.</p>";
    }
  });
}
</script>

</body>
</html>
