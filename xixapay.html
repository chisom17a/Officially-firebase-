<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Xixipay Deposit - Chiearn Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  background:#f4f7fa;
  font-family:Inter,system-ui,sans-serif;
}
.container{
  max-width:450px;
  margin:40px auto;
  background:#fff;
  padding:25px;
  border-radius:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}
h2{text-align:center;color:#0d6efd}
.amount-box{
  background:#f0f5ff;
  padding:15px;
  border-radius:10px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin:20px 0;
}
button{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
.pay-btn{background:#0d6efd;color:white}
.cancel-btn{background:#aaa;color:white;margin-top:10px}
#loading{
  display:none;
  text-align:center;
}
.spinner{
  border:4px solid #eee;
  border-top:4px solid #0d6efd;
  border-radius:50%;
  width:40px;
  height:40px;
  margin:15px auto;
  animation:spin 1s linear infinite;
}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
</style>
</head>

<body>

<div class="container">
  <h2>Xixipay Deposit</h2>

  <p id="infoText"></p>

  <div class="amount-box" id="amountBox">₦0</div>

  <button class="pay-btn" id="payBtn">Proceed to Payment</button>
  <button class="cancel-btn" onclick="location.href='deposit.html'">Cancel</button>

  <div id="loading">
    <div class="spinner"></div>
    Initializing payment...
  </div>
</div>

<!-- FIREBASE + LOGIC -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCajnnfI9oxVDv4B44tiMsIgTDApt1rFjc",
  authDomain: "chiearnhub-5ba9e.firebaseapp.com",
  projectId: "chiearnhub-5ba9e",
  storageBucket: "chiearnhub-5ba9e.firebasestorage.app",
  messagingSenderId: "332513744974",
  appId: "1:332513744974:web:bfb84a79d0dbbb0057cb1f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= LOAD AMOUNT ================= */
const pending = JSON.parse(localStorage.getItem("pendingDeposit"));
if(!pending || !pending.amount){
  alert("No deposit amount found");
  location.href = "deposit.html";
}

const amount = Number(pending.amount);

if(amount < 100){
  alert("Minimum deposit is ₦100");
  location.href = "deposit.html";
}

document.getElementById("amountBox").textContent = "₦" + amount.toLocaleString();
document.getElementById("infoText").textContent =
  "You are about to deposit ₦" + amount.toLocaleString() + " using Xixipay";

/* ================= AUTH CHECK ================= */
let currentUser = null;
let userData = null;

onAuthStateChanged(auth, async (user)=>{
  if(!user){
    alert("Please login");
    location.href = "login.html";
    return;
  }

  currentUser = user;

  const snap = await getDoc(doc(db,"users",user.uid));
  if(!snap.exists() || snap.data().model !== "Advertiser"){
    alert("Unauthorized");
    location.href = "login.html";
    return;
  }

  userData = snap.data();
});

/* ================= PAY ================= */
document.getElementById("payBtn").onclick = async ()=>{
  if(!currentUser || !userData) return alert("User not ready");

  document.getElementById("payBtn").style.display="none";
  document.getElementById("loading").style.display="block";

  try{
    // 1. Create deposit record
    const depRef = await addDoc(collection(db,"deposits"),{
      userId: currentUser.uid,
      email: currentUser.email,
      amount: amount,
      method: "Xixipay",
      status: "pending",
      createdAt: serverTimestamp()
    });

    // 2. Call your backend (Render)
    const res = await fetch("https://chiearnhub-backend.onrender.com/init-xixipay",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        amount: amount,
        email: currentUser.email,
        depositId: depRef.id,
        callback: "https://chiearnhub.vercel.app/advertiser.html"
      })
    });

    const data = await res.json();

    if(!data.success){
      throw new Error(data.message || "Payment init failed");
    }

    // 3. Go to Xixipay
    localStorage.removeItem("pendingDeposit");
    window.location.href = data.paymentUrl;

  }catch(err){
    alert("Error: " + err.message);
    document.getElementById("payBtn").style.display="block";
    document.getElementById("loading").style.display="none";
  }
};
</script>

</body>
</html>
