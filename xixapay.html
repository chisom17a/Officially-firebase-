<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xixapay Deposit - Chiearn Hub</title>
<style>
body{
  font-family: Inter, sans-serif;
  background:#f4f7fa;
  margin:0;
  padding:0;
}
header{
  background:#0d6efd;
  color:white;
  padding:15px;
  font-size:20px;
  text-align:center;
}
.container{
  max-width:500px;
  margin:40px auto;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}
input,button{
  width:100%;
  padding:12px;
  margin:10px 0;
  font-size:16px;
  border-radius:8px;
  border:1px solid #ccc;
  box-sizing:border-box;
}
button{
  background:#0d6efd;
  color:white;
  font-weight:bold;
  border:none;
  cursor:pointer;
}
#loading{
  display:none;
  text-align:center;
  margin-top:15px;
}
.spinner{
  border:4px solid #eee;
  border-top:4px solid #0d6efd;
  border-radius:50%;
  width:40px;
  height:40px;
  margin:10px auto;
  animation:spin 1s linear infinite;
}
@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}
</style>
</head>
<body>

<header>Xixapay Deposit</header>

<div class="container">
  <h3>Deposit via Xixapay</h3>
  <p id="msg" style="font-weight:bold;"></p>
  <input type="text" id="amountInput" placeholder="Amount (₦)" readonly>
  <button id="proceedBtn">Proceed to Pay</button>

  <div id="loading">
    <div class="spinner"></div>
    Processing payment...
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCajnnfI9oxVDv4B44tiMsIgTDApt1rFjc",
  authDomain: "chiearnhub-5ba9e.firebaseapp.com",
  projectId: "chiearnhub-5ba9e",
  storageBucket: "chiearnhub-5ba9e.firebasestorage.app",
  messagingSenderId: "332513744974",
  appId: "1:332513744974:web:bfb84a79d0dbbb0057cb1f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser;
let userData;
let pendingDeposit = JSON.parse(localStorage.getItem("pendingDeposit"));

if(!pendingDeposit){
  alert("No pending deposit found!");
  window.location.href = "deposit.html";
}

document.getElementById("amountInput").value = pendingDeposit.amount;

// ✅ Check auth
onAuthStateChanged(auth, async user=>{
  if(!user) return window.location.href="login.html";

  currentUser = user;
  const snap = await getDoc(doc(db,"users",user.uid));
  if(!snap.exists()){
    alert("User record not found!");
    return window.location.href="login.html";
  }

  userData = snap.data();
  if(userData.model !== "Advertiser"){
    alert("Unauthorized access!");
    return window.location.href="login.html";
  }

  // Ensure minimum deposit
  if(pendingDeposit.amount < 100){
    alert("Minimum deposit is ₦100");
    return window.location.href="deposit.html";
  }

  document.getElementById("msg").innerText = 
    `You are about to deposit ₦${pendingDeposit.amount}. Click proceed to pay via Xixapay.`;
});

// ✅ Proceed button
document.getElementById("proceedBtn").addEventListener("click", async ()=>{
  const btn = document.getElementById("proceedBtn");
  btn.style.display = "none";
  document.getElementById("loading").style.display = "block";

  try{
    const res = await fetch("https://chiearnhub-backend.onrender.com/init-xixapay",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        amount: pendingDeposit.amount,
        email: currentUser.email,
        depositId: pendingDeposit.id
      })
    });

    const data = await res.json();

    if(!data.success){
      alert("Payment initialization failed: " + data.message);
      btn.style.display="block";
      document.getElementById("loading").style.display="none";
      return;
    }

    // Redirect to Xixapay payment page
    window.location.href = data.paymentUrl;

  }catch(err){
    console.error(err);
    alert("Error: "+err.message);
    btn.style.display="block";
    document.getElementById("loading").style.display="none";
  }
});
</script>

</body>
</html>
