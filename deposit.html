<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit - Chiearn Hub</title>

<style>
:root {
  --primary: #0d6efd;
  --bg: #f4f7fa;
  --white: #fff;
  --shadow: rgba(0,0,0,.1);
}

* { box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { margin: 0; background: var(--bg); }

header {
  background: var(--white);
  padding: 15px 25px;
  font-size: 22px;
  font-weight: 600;
  color: var(--primary);
  box-shadow: 0 2px 8px var(--shadow);
}

.container {
  max-width: 500px;
  margin: 50px auto;
  padding: 25px;
  background: var(--white);
  border-radius: 12px;
  box-shadow: 0 4px 12px var(--shadow);
  text-align: center;
}

input, select {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  padding: 12px 20px;
  border-radius: 8px;
  border: none;
  font-weight: 600;
  cursor: pointer;
  background: var(--primary);
  color: #fff;
  font-size: 16px;
  margin-top: 10px;
}

.spinner {
  border: 4px solid #f3f3f3;
  border-top: 4px solid var(--primary);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  margin: 15px auto;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>

<header>Chiearn Hub - Deposit</header>

<div class="container" id="depositBox">
  <h2>Make a Deposit</h2>

  <input type="number" id="amount" placeholder="Enter amount" min="200">

  <select id="method">
    <option value="">Select Deposit Method</option>
    <option value="squadco">Squadco</option>
    <option value="manuel">Manuel</option>
    <option value="korapay">Korapay</option>
    <option value="usdt">USDT</option>
  </select>

  <p>Minimum deposit is ₦200</p>

  <button id="proceedBtn">Proceed</button>

  <div id="loading" style="display:none;">
    <div class="spinner"></div>
    Processing...
  </div>
</div>

<!-- ================= FIREBASE ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCajnnfI9oxVDv4B44tiMsIgTDApt1rFjc",
  authDomain: "chiearnhub-5ba9e.firebaseapp.com",
  projectId: "chiearnhub-5ba9e",
  storageBucket: "chiearnhub-5ba9e.firebasestorage.app",
  messagingSenderId: "332513744974",
  appId: "1:332513744974:web:bfb84a79d0dbbb0057cb1f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUserData = null;

/* ================= PROTECT PAGE ================= */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    alert("Please login first");
    window.location.href = "login.html";
    return;
  }

  const snap = await getDoc(doc(db, "users", user.uid));

  if (!snap.exists()) {
    alert("Account not found");
    window.location.href = "login.html";
    return;
  }

  currentUserData = snap.data();

  if (currentUserData.model !== "Advertiser") {
    alert("Only advertisers can access this page");
    window.location.href = "dashboard.html";
    return;
  }
});

/* ================= DEPOSIT ================= */
document.getElementById("proceedBtn").addEventListener("click", async () => {
  const amount = Number(document.getElementById("amount").value);
  const method = document.getElementById("method").value;

  if (!amount || amount < 200) {
    alert("Minimum deposit is ₦200");
    return;
  }

  if (!method) {
    alert("Select a deposit method");
    return;
  }

  document.getElementById("loading").style.display = "block";

  // Save deposit to Firestore
  const depositRef = await addDoc(collection(db, "deposits"), {
    userId: auth.currentUser.uid,
    email: currentUserData.email,
    amount: amount,
    method: method,
    status: "pending",
    createdAt: serverTimestamp()
  });

  // Redirect based on method
  setTimeout(() => {
    if (method === "squadco") window.location.href = "deposit-squadco.html?id=" + depositRef.id;
    if (method === "manuel") window.location.href = "deposit-manuel.html?id=" + depositRef.id;
    if (method === "korapay") window.location.href = "deposit-korapay.html?id=" + depositRef.id;
    if (method === "usdt") window.location.href = "deposit-usdt.html?id=" + depositRef.id;
  }, 1500);
});
</script>

</body>
</html>
