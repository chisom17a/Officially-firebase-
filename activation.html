<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Account Activation - Chiearn Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://js.paystack.co/v1/inline.js"></script>

<style>
body{font-family:Poppins;background:#f3f6fb;padding:20px}
.container{max-width:480px;margin:auto;background:#fff;padding:25px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
button,input{width:100%;padding:12px;margin:10px 0;border-radius:10px;border:1px solid #ccc}
button{background:#2563eb;color:#fff;border:none;font-size:16px}
.success{display:none;background:#e0ffe4;padding:15px;border-radius:10px;margin-top:15px;color:#166534;font-weight:bold;text-align:center}
</style>
</head>

<body>

<div class="container">
  <h2>Activate Your Account</h2>

  <p>Pay <b>₦700</b> and upload proof:</p>
  <p>
    <b>Account Number:</b> 9162141283<br>
    <b>Bank:</b> Opay<br>
    <b>Account Name:</b> Chisom Nnonyelu Favour
  </p>

  <input type="text" id="senderName" placeholder="Sender name" />
  <input type="file" id="proofImage" accept="image/*" />

  <button id="sendBtn">I've Sent It</button>

  <div class="success" id="successBox">
    ✅ Submitted! Redirecting...
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, addDoc, collection, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCajnnfI9oxVDv4B44tiMsIgTDApt1rFjc",
  authDomain: "chiearnhub-5ba9e.firebaseapp.com",
  projectId: "chiearnhub-5ba9e",
  appId: "1:332513744974:web:bfb84a79d0dbbb0057cb1f"
};

const IMG_BB_KEY = "fb44bf17871e5949e02fe80b4f56fa47";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

/* ================= AUTH & ROLE CHECK ================= */
onAuthStateChanged(auth, async (user)=>{
  if(!user){
    location.href = "login.html";
    return;
  }

  currentUser = user;

  const userRef = doc(db,"users",user.uid);
  const snap = await getDoc(userRef);

  if(!snap.exists()){
    alert("Profile error");
    return;
  }

  const u = snap.data();

  // Only earners
  if(u.model !== "Earner"){
    alert("Only earners can access this page");
    location.href = "index.html";
    return;
  }

  // Already active?
  if(u.status === "active"){
    location.href = "task2.html";
    return;
  }
});

/* ================= IMGBB UPLOAD ================= */
async function uploadToImgBB(file){
  const fd = new FormData();
  fd.append("image", file);

  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMG_BB_KEY}`, {
    method: "POST",
    body: fd
  });

  const data = await res.json();
  if(!data.success) throw "Image upload failed";

  return data.data.url;
}

/* ================= SUBMIT ================= */
document.getElementById("sendBtn").addEventListener("click", submitRequest);

async function submitRequest(){
  const senderName = document.getElementById("senderName").value.trim();
  const file = document.getElementById("proofImage").files[0];

  if(!senderName) return alert("Enter sender name");
  if(!file) return alert("Upload proof");

  try{
    document.getElementById("sendBtn").disabled = true;

    const imageUrl = await uploadToImgBB(file);

    // Save activation request
    await addDoc(collection(db,"activationRequests"),{
      uid: currentUser.uid,
      email: currentUser.email,
      senderName: senderName,
      proofImage: imageUrl,
      status: "pending",
      createdAt: serverTimestamp()
    });

    // Mark user as pending
    await updateDoc(doc(db,"users",currentUser.uid),{
      status: "pending"
    });

    document.getElementById("successBox").style.display = "block";

    setTimeout(()=>{
      location.href = "earner.html";
    },3000);

  }catch(err){
    alert(err);
    document.getElementById("sendBtn").disabled = false;
  }
}
</script>

</body>
</html>
