<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Activation - Chiearn Hub</title>

<script src="https://js.paystack.co/v1/inline.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#f3f6fb;padding:20px}
.container{max-width:480px;margin:auto;background:#fff;padding:25px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
h2{text-align:center;margin-bottom:12px}
input,button{width:100%;padding:12px;margin:8px 0 15px;border-radius:10px;border:1px solid #ccc}
button{border:none;color:#fff;font-size:16px;cursor:pointer}
.send-btn{background:#2563eb}
.cancel-btn{background:#ef4444}
.success-box{display:none;text-align:center;background:#e0ffe4;padding:15px;border-radius:10px;margin-top:20px;border:1px solid #4ade80;color:#166534;font-weight:bold}
</style>
</head>
<body>

<div class="container">
<h2>Activate Your Account</h2>

<p>Deposit <b>₦700</b> to:</p>
<p>
<b>Account Number:</b> 9162141283<br>
<b>Bank:</b> Opay<br>
<b>Account Name:</b> Chisom Nnonyelu Favour
</p>

<input id="senderName" placeholder="Sender name (required)">
<input type="file" id="proofImage" accept="image/*">

<button class="send-btn" id="sendBtn">I've Paid</button>
<button class="cancel-btn" onclick="location.href='earner.html'">Cancel</button>

<div class="success-box" id="successBox">
✅ Submitted! Under review... Redirecting...
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, collection, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCajnnfI9oxVDv4B44tiMsIgTDApt1rFjc",
  authDomain: "chiearnhub-5ba9e.firebaseapp.com",
  projectId: "chiearnhub-5ba9e"
};

const IMG_BB_KEY = "fb44bf17871e5949e02fe80b4f56fa47";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

/* ================= AUTH CHECK ================= */
onAuthStateChanged(auth, async (user)=>{
  if(!user){
    location.href="login.html";
    return;
  }

  currentUser = user;

  const userRef = doc(db,"users",user.uid);
  const snap = await getDoc(userRef);

  if(!snap.exists()){
    alert("User record missing");
    return;
  }

  const userData = snap.data();

  // Only earners
  if(userData.model !== "Earner"){
    alert("Only earners can access this page");
    location.href="index.html";
    return;
  }

  // If already activated → redirect
  if(userData.activated === true){
    location.href = "task2.html";
    return;
  }

  // If pending → block resubmission
  if(userData.activationStatus === "pending"){
    alert("Your activation is already under review");
    location.href="earner.html";
    return;
  }
});

/* ================= IMGBB UPLOAD ================= */
async function uploadToImgBB(file){
  const formData = new FormData();
  formData.append("image", file);

  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMG_BB_KEY}`, {
    method: "POST",
    body: formData
  });

  const data = await res.json();
  if(!data.success) throw "Image upload failed";

  return data.data.url;
}

/* ================= SUBMIT ================= */
document.getElementById("sendBtn").addEventListener("click", submitActivation);

async function submitActivation(){
  const senderName = document.getElementById("senderName").value.trim();
  const file = document.getElementById("proofImage").files[0];

  if(!senderName) return alert("Sender name required");
  if(!file) return alert("Upload payment proof");

  try{
    document.getElementById("sendBtn").disabled = true;

    const imageUrl = await uploadToImgBB(file);

    // Save activation request
    await addDoc(collection(db,"activationRequests"), {
      uid: currentUser.uid,
      email: currentUser.email,
      senderName,
      proofImage: imageUrl,
      status: "pending",
      createdAt: serverTimestamp()
    });

    // Update user status
    await updateDoc(doc(db,"users",currentUser.uid), {
      activationStatus: "pending",
      activated: false
    });

    document.getElementById("successBox").style.display = "block";

    setTimeout(()=>{
      location.href="earner.html";
    }, 3000);

  }catch(err){
    alert(err);
    document.getElementById("sendBtn").disabled = false;
  }
}
</script>

</body>
</html>
