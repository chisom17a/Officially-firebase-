<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chiearn Hub - Admin Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{display:flex;background:#f2f5fb;min-height:100vh}

.sidebar{
  width:260px;background:#1e293b;color:#fff;
  position:fixed;left:-260px;top:0;height:100%;
  padding:25px 20px;transition:.3s
}
.sidebar.active{left:0}
.sidebar h2{text-align:center;margin-bottom:25px}
.sidebar a{
  display:block;padding:12px 15px;color:#cbd5e1;
  text-decoration:none;border-radius:6px;margin-bottom:8px
}
.sidebar a:hover{background:#334155}

.logout-btn{
  margin-top:20px;padding:12px;background:#ef4444;
  color:#fff;border:none;width:100%;
  border-radius:6px;cursor:pointer
}

.main{width:100%;padding:30px;transition:.3s}
.main.shifted{margin-left:260px}

.top-bar{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:25px
}

.hamburger{
  font-size:24px;cursor:pointer;
  background:#fff;padding:8px 12px;
  border-radius:6px;
  box-shadow:0 2px 8px rgba(0,0,0,.1)
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px
}

.card{
  background:#fff;padding:20px;border-radius:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.06)
}

.card h3{font-size:16px;color:#475569}
.card p{font-size:28px;font-weight:700}

#spinner{
  position:fixed;inset:0;
  background:rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center;
  z-index:999
}
.spinner{
  width:45px;height:45px;
  border:5px solid #ccc;
  border-top:5px solid #0d6efd;
  border-radius:50%;
  animation:spin 1s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>

<div id="spinner"><div class="spinner"></div></div>

<div class="sidebar" id="sidebar">
  <h2>Admin Panel</h2>
  <a href="user.html">Users</a>
  <a href="adcony.html">Ad Approval</a>
  <a href="admin-task-review.html">Task Approval</a>
  <a href="balcony.html">Balance Control</a>
  <a href="supportline.html">Support</a>
  <a href="taskmaster.html">Tasks</a>
  <a href="update.html">Updates</a>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="main" id="main">
  <div class="top-bar">
    <span class="hamburger" onclick="toggleSidebar()">☰</span>
    <h1 id="adminWelcome">Loading...</h1>
  </div>

  <div class="cards">
    <div class="card"><h3>Total Users</h3><p id="totalUsers">0</p></div>
    <div class="card"><h3>Earners</h3><p id="earnersCount">0</p></div>
    <div class="card"><h3>Advertisers</h3><p id="advertisersCount">0</p></div>
    <div class="card"><h3>Admins</h3><p id="adminsCount">0</p></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import { getFirestore, collection, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* ✅ SAME FIREBASE PROJECT AS LOGIN PAGE */
const firebaseConfig = {
  apiKey: "AIzaSyCqHY59fXbXWTOtki5cBT-qryPVNerzToM",
  authDomain: "chiearnhubvercel.firebaseapp.com",
  projectId: "chiearnhubvercel",
  storageBucket: "chiearnhubvercel.firebasestorage.app",
  messagingSenderId: "1069350970788",
  appId: "1:1069350970788:web:b6fb81b6c397344d118d31"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const spinner = document.getElementById("spinner");
const hideSpinner = () => spinner.style.display = "none";

/* 🔐 STABLE ADMIN AUTH CHECK */
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = "login.html";
    return;
  }

  try {
    const snap = await getDoc(doc(db, "users", user.uid));

    if (!snap.exists()) {
      alert("Account record missing.");
      hideSpinner();
      return;
    }

    const role = (snap.data().model || "").toLowerCase();
    if (role !== "admin") {
      alert("Unauthorized access");
      location.href = "login.html";
      return;
    }

    adminWelcome.textContent =
      `Welcome, ${snap.data().username || user.email}`;

    hideSpinner();

  } catch (err) {
    console.error(err);
    alert("Connection error. Refresh page.");
    hideSpinner();
  }
});

/* 📊 LIVE USER COUNTS */
onSnapshot(collection(db, "users"), (snap) => {
  let total=0, earners=0, advertisers=0, admins=0;

  snap.forEach(d => {
    total++;
    const role = (d.data().model || "").toLowerCase();
    if (role === "earner") earners++;
    else if (role === "advertiser") advertisers++;
    else if (role === "admin") admins++;
  });

  totalUsers.textContent = total;
  earnersCount.textContent = earners;
  advertisersCount.textContent = advertisers;
  adminsCount.textContent = admins;
});

/* UI */
window.toggleSidebar = () => {
  sidebar.classList.toggle("active");
  main.classList.toggle("shifted");
};

/* LOGOUT (MANUAL ONLY) */
window.logout = async () => {
  await signOut(auth);
  location.href = "login.html";
};
</script>

</body>
</html>
