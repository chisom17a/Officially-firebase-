<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual Deposit - Chiearn Hub</title>

<style>
:root {
  --primary: #0d6efd;
  --bg: #f4f7fa;
  --white: #fff;
  --shadow: rgba(0,0,0,.1);
}

* { box-sizing: border-box; font-family: Inter, sans-serif; }
body { margin: 0; background: var(--bg); }

header {
  background: var(--white);
  padding: 15px 25px;
  font-size: 22px;
  font-weight: 600;
  color: var(--primary);
  box-shadow: 0 2px 8px var(--shadow);
}

.container {
  max-width: 520px;
  margin: 40px auto;
  background: var(--white);
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 12px var(--shadow);
}

.bank-box {
  background: #f1f5ff;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
}

.bank-box strong { display: block; margin-bottom: 5px; }

button {
  padding: 12px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-weight: 600;
}

.primary { background: var(--primary); color: #fff; }
.secondary { background: #ddd; }

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.spinner {
  border: 4px solid #f3f3f3;
  border-top: 4px solid var(--primary);
  border-radius: 50%;
  width: 35px;
  height: 35px;
  animation: spin 1s linear infinite;
  margin: 15px auto;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<header>Manual Deposit</header>

<div class="container">

  <h3>Transfer the exact amount to:</h3>

  <div class="bank-box">
    <strong>Account Number:</strong>
    <span id="acct">9162141283</span>
    <button onclick="copyAcct()">Copy</button>

    <strong>Bank:</strong> Opay  
    <strong>Account Name:</strong> Chisom Nnonyelu Favour
  </div>

  <p>After payment, submit proof below</p>

  <input type="text" id="senderName" placeholder="Sender's Name">
  <input type="file" id="proofImage" accept="image/*">

  <button class="primary" id="submitBtn">Submit Proof</button>
  <button class="secondary" onclick="window.location.href='deposit.html'">Cancel</button>

  <div id="loading" style="display:none;text-align:center">
    <div class="spinner"></div>
    Uploading proof...
  </div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCajnnfI9oxVDv4B44tiMsIgTDApt1rFjc",
  authDomain: "chiearnhub-5ba9e.firebaseapp.com",
  projectId: "chiearnhub-5ba9e",
  storageBucket: "chiearnhub-5ba9e.firebasestorage.app",
  messagingSenderId: "332513744974",
  appId: "1:332513744974:web:bfb84a79d0dbbb0057cb1f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let userData = null;

// AUTH CHECK
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    alert("Login required");
    window.location.href = "login.html";
    return;
  }

  const snap = await getDoc(doc(db, "users", user.uid));
  if (!snap.exists() || snap.data().model !== "Advertiser") {
    alert("Unauthorized");
    window.location.href = "login.html";
    return;
  }

  userData = snap.data();
});

// COPY ACCOUNT
window.copyAcct = () => {
  navigator.clipboard.writeText("9162141283");
  alert("Account number copied");
};

// SUBMIT PROOF
document.getElementById("submitBtn").addEventListener("click", async () => {
  const sender = document.getElementById("senderName").value.trim();
  const file = document.getElementById("proofImage").files[0];

  if (!sender || !file) {
    alert("Sender name and proof required");
    return;
  }

  const deposit = JSON.parse(localStorage.getItem("pendingDeposit"));
  if (!deposit) {
    alert("No pending deposit found");
    return;
  }

  document.getElementById("submitBtn").style.display = "none";
  document.getElementById("loading").style.display = "block";

  // UPLOAD TO IMGBB
  const formData = new FormData();
  formData.append("image", file);

  const res = await fetch(
    "https://api.imgbb.com/1/upload?key=fb44bf17871e5949e02fe80b4f56fa47",
    { method: "POST", body: formData }
  );

  const img = await res.json();
  const imageUrl = img.data.url;

  // SAVE TO FIRESTORE
  await addDoc(collection(db, "deposits"), {
    userId: auth.currentUser.uid,
    email: userData.email,
    amount: deposit.amount,
    method: "Manual",
    senderName: sender,
    proofImage: imageUrl,
    referral: userData.referral || null,
    status: "pending",
    createdAt: serverTimestamp()
  });

  localStorage.removeItem("pendingDeposit");
  alert("Deposit submitted. Await admin approval.");
  window.location.href = "deposithistory.html";
});
</script>

</body>
</html>
