<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual Deposit - Chiearn Hub</title>

<style>
body {
  margin: 0;
  background: #f4f7fa;
  font-family: Inter, sans-serif;
}

header {
  background: white;
  padding: 15px 25px;
  font-size: 20px;
  font-weight: bold;
  color: #0d6efd;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

.container {
  max-width: 500px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 12px rgba(0,0,0,.1);
}

.bank-box {
  background: #f0f5ff;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.bank-box p {
  margin: 6px 0;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  font-size: 16px;
  margin-top: 10px;
}

.submit-btn { background: #0d6efd; color: white; }
.cancel-btn { background: #aaa; color: white; }
.copy-btn { background: #198754; color: white; }

#loading {
  display: none;
  text-align: center;
  margin-top: 15px;
}

.spinner {
  border: 4px solid #eee;
  border-top: 4px solid #0d6efd;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  margin: 10px auto;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<header>Manual Deposit</header>

<div class="container">

  <p id="depositMessage" style="font-weight:bold;"></p>

  <h3>Transfer To:</h3>

  <div class="bank-box">
    <p>Bank: <b>OPAY</b></p>
    <p>Account Name: <b>Chisom Nnonyelu Favour</b></p>
    <p>Account Number: <b id="acct">9162141283</b></p>
    <button class="copy-btn" onclick="copyAccount()">📋 Copy Account Number</button>
  </div>

  <p><b>After payment, submit your proof below</b></p>

  <input type="text" id="senderName" placeholder="Sender's Name">
  <input type="file" id="proofFile" accept="image/*">

  <button class="submit-btn" id="submitBtn">Submit Proof</button>
  <button class="cancel-btn" onclick="window.location.href='deposit.html'">Cancel</button>

  <div id="loading">
    <div class="spinner"></div>
    Submitting deposit...
  </div>

</div>

<!-- FIREBASE + IMGBB -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCajnnfI9oxVDv4B44tiMsIgTDApt1rFjc",
  authDomain: "chiearnhub-5ba9e.firebaseapp.com",
  projectId: "chiearnhub-5ba9e",
  storageBucket: "chiearnhub-5ba9e.firebasestorage.app",
  messagingSenderId: "332513744974",
  appId: "1:332513744974:web:bfb84a79d0dbbb0057cb1f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔑 Your imgBB API key
const IMGBB_API_KEY = "fb44bf17871e5949e02fe80b4f56fa47";

let userData = null;
let pending = null;

// Load pending deposit
pending = JSON.parse(localStorage.getItem("pendingDeposit"));
if (!pending) {
  alert("No pending deposit found");
  window.location.href = "deposit.html";
}

// Show message
document.getElementById("depositMessage").innerText =
  `Transfer ₦${pending.amount} to the account details below and submit proof of payment for verification. A 5% bonus will be added to the deposit amount.`;

// Auth check
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    alert("Please login");
    window.location.href = "login.html";
    return;
  }

  const snap = await getDoc(doc(db, "users", user.uid));
  if (!snap.exists()) {
    alert("User record not found");
    return;
  }

  userData = snap.data();
});

// Copy account number
window.copyAccount = function() {
  navigator.clipboard.writeText("9162141283");
  alert("Account number copied!");
}

// Upload to imgBB
async function uploadToImgBB(file) {
  const formData = new FormData();
  formData.append("image", file);

  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
    method: "POST",
    body: formData
  });

  const data = await res.json();
  if (!data.success) throw new Error("Image upload failed");

  return data.data.url;
}

// Submit proof
document.getElementById("submitBtn").addEventListener("click", async () => {
  const senderName = document.getElementById("senderName").value.trim();
  const file = document.getElementById("proofFile").files[0];

  if (!senderName || !file) {
    alert("Please enter sender name and upload proof image");
    return;
  }

  document.getElementById("submitBtn").style.display = "none";
  document.getElementById("loading").style.display = "block";

  try {
    // Upload image
    const imageUrl = await uploadToImgBB(file);

    // Save to Firestore
    await addDoc(collection(db, "deposits"), {
      userId: auth.currentUser.uid,
      email: userData.email,
      amount: pending.amount,
      method: "Manual",
      senderName: senderName,
      proofImage: imageUrl,
      referral: userData.referral || null,
      status: "pending",
      createdAt: serverTimestamp()
    });

    localStorage.removeItem("pendingDeposit");

    alert("Deposit submitted successfully! Awaiting admin approval.");
    window.location.href = "advertiser.html";

  } catch (err) {
    alert("Error: " + err.message);
    document.getElementById("submitBtn").style.display = "block";
    document.getElementById("loading").style.display = "none";
  }
});
</script>

</body>
</html>
