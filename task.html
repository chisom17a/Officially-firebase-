<!DOCTYPE html>
<html>
<head>
<title>Perform Task</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
body{font-family:Inter;background:#f4f7fa;padding:20px}
.box{background:#fff;max-width:520px;margin:auto;padding:20px;border-radius:10px}
input,textarea,button{width:100%;margin:10px 0;padding:10px}
button{background:#0d6efd;color:#fff;border:none;border-radius:6px;cursor:pointer}
button[disabled]{opacity:.6}
.loader{display:none;text-align:center;padding:10px;font-weight:bold}
.guide{background:#f1f5f9;padding:12px;border-radius:8px;margin:10px 0;font-size:14px}
</style>
</head>

<body>
<div class="box">
  <h2 id="title">getting task details......</h2>

  <p><b>Reward:</b> ₦<span id="earnerPrice"></span></p>
  <p><b>Proof Required:</b> <span id="proof"></span></p>

  <!-- ✅ TASK GUIDE -->
  <div class="guide">
    <b>Task Guide</b>
    <p id="taskGuide">Loading task guide...</p>
  </div>

  <a id="visit" target="_blank">
    <button type="button">Visit Task</button>
  </a>

  <textarea id="textProof" placeholder="Text proof (required)"></textarea>
  <input type="file" id="imageProof" accept="image/*">

  <button id="submitBtn">Submit Task</button>
  <button onclick="location.href='task2.html'">cancel</button>
  <div class="loader" id="loader">⏳ Submitting... Please wait and don't refresh</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, updateDoc, setDoc,
  serverTimestamp, increment
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* 🔥 chiearnhubvercel CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCqHY59fXbXWTOtki5cBT-qryPVNerzToM",
  authDomain: "chiearnhubvercel.firebaseapp.com",
  projectId: "chiearnhubvercel",
  storageBucket: "chiearnhubvercel.firebasestorage.app",
  messagingSenderId: "1069350970788",
  appId: "1:1069350970788:web:b6fb81b6c397344d118d31"
};

const IMG_BB_KEY = "fb44bf17871e5949e02fe80b4f56fa47";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= LOCAL STORAGE CHECK ================= */
const storedUser = JSON.parse(localStorage.getItem("currentUser"));
if(!storedUser || storedUser.model !== "Earner"){
  alert("Please login as an earner");
  location.href="login.html";
}

const taskId = new URLSearchParams(location.search).get("id");
if(!taskId) location.href="tasks.html";

let currentUser, userData, taskData;

/* ================= AUTH VERIFY ================= */
onAuthStateChanged(auth, async user=>{
  if(!user || user.uid !== storedUser.uid){
    localStorage.removeItem("currentUser");
    return location.href="login.html";
  }

  currentUser = user;

  const uSnap = await getDoc(doc(db,"users",user.uid));
  if(!uSnap.exists() || uSnap.data().model !== "Earner"){
    alert("Unauthorized");
    return location.href="login.html";
  }

  userData = uSnap.data();
  loadTask();
});

/* ================= LOAD TASK ================= */
async function loadTask(){
  const snap = await getDoc(doc(db,"availabletasks",taskId));
  if(!snap.exists()) return location.href="tasks.html";

  taskData = snap.data();

  title.innerText = `${taskData.platform} - ${taskData.type}`;
  earnerPrice.innerText = taskData.earnerPrice;
  proof.innerText = taskData.proofTitle;
  taskGuide.innerText = taskData.guide || "Follow the instructions carefully and don't undo a tssk after submitting to avoid ban";
  visit.href = taskData.link;
}

/* ================= IMAGE UPLOAD ================= */
async function uploadToImgBB(file){
  const fd = new FormData();
  fd.append("image", file);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMG_BB_KEY}`,{
    method:"POST", body:fd
  });
  const data = await res.json();
  if(!data.success) throw "Image upload failed";
  return data.data.url;
}

/* ================= SUBMIT ================= */
submitBtn.onclick = async ()=>{
  if(!textProof.value.trim()) return alert("Text proof required");
  if(!imageProof.files[0]) return alert("Image proof required");

  submitBtn.disabled = true;
  loader.style.display = "block";

  try{
    const imgUrl = await uploadToImgBB(imageProof.files[0]);
    const submissionId = crypto.randomUUID();

    const payload = {
      submissionId,
      taskId,
      userId: currentUser.uid,
      userEmail: currentUser.email,
      username: userData.username || "",
      posterId: taskData.posterId,
      platform: taskData.platform,
      type: taskData.type,
      reward: taskData.earnerPrice,
      proofText: textProof.value.trim(),
      proofImage: imgUrl,
      status:"pending",
      createdAt: serverTimestamp()
    };

    await setDoc(doc(db,"submissions",submissionId),payload);
    await setDoc(doc(db,"adminTaskQueue",submissionId),payload);
    await updateDoc(doc(db,"availabletasks",taskId),{
      remaining: increment(-1)
    });

    await setDoc(
      doc(db,"users",currentUser.uid,"completedTasks",taskId),
      { completedAt: serverTimestamp() }
    );

    alert("✅ Task submitted successfully");
    location.href="earner.html";

  }catch(e){
    alert("❌ " + e);
    submitBtn.disabled=false;
    loader.style.display="none";
  }
};
</script>
</body>
</html>
