<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - Chiearn Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #0d6efd;
  --bg: #f4f7fa;
  --white: #fff;
  --shadow: rgba(0,0,0,.1);
}

* { box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { margin: 0; background: var(--bg); }

header {
  background: var(--white);
  padding: 15px 25px;
  font-size: 22px;
  font-weight: 600;
  color: var(--primary);
  box-shadow: 0 2px 8px var(--shadow);
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 25px;
}

.profile-section {
  background: var(--white);
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 12px var(--shadow);
  margin-bottom: 20px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  padding: 10px 15px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  background: var(--primary);
  color: #fff;
}

.profile-pic {
  max-width: 120px;
  border-radius: 50%;
  margin-bottom: 12px;
}

/* SPINNER */
#spinner {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.spinner {
  width: 45px;
  height: 45px;
  border: 5px solid #ccc;
  border-top: 5px solid var(--primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div id="spinner"><div class="spinner"></div></div>

<header>Chiearn Hub - Profile</header>

<div class="container">
  <button onclick="location.href='earner.html'">⬅ Back To Dashboard</button>

  <div class="profile-section">
    <h3>User Info</h3>
    <img id="profilePic" class="profile-pic">
    <input type="file" id="picInput" accept="image/*">
    <button onclick="uploadPic()">Upload Profile Picture</button>

    <p><b>Username:</b> <span id="username"></span></p>
    <p><b>Email:</b> <span id="email"></span></p>
    <p><b>Phone:</b> <span id="phone"></span></p>
    <p><b>Account Type:</b> <span id="model"></span></p>
    <p><b>Balance:</b> ₦<span id="balance"></span></p>
    <p><b>Referral Count:</b> <span id="referralCount"></span></p>
  </div>

  <div class="profile-section">
    <h3>Bank Details</h3>
    <input id="bankName" placeholder="Bank Name">
    <input id="accountNumber" placeholder="Account Number">
    <input id="accountName" placeholder="Account Name">
    <button onclick="saveBank()">Save Bank Details</button>
  </div>

  <div class="profile-section">
    <h3>Professional Details</h3>
    <textarea id="bio" placeholder="Your bio"></textarea>
    <input id="skills" placeholder="Skills (comma separated)">
    <button onclick="saveProfessional()">Save Professional Details</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* NEW FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCqHY59fXbXWTOtki5cBT-qryPVNerzToM",
  authDomain: "chiearnhubvercel.firebaseapp.com",
  projectId: "chiearnhubvercel",
  storageBucket: "chiearnhubvercel.firebasestorage.app",
  messagingSenderId: "1069350970788",
  appId: "1:1069350970788:web:b6fb81b6c397344d118d31"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const spinner = document.getElementById("spinner");
const showSpin = () => spinner.style.display = "flex";
const hideSpin = () => spinner.style.display = "none";

let userRef;

/* LOCAL STORAGE + AUTH CHECK */
const localUser = localStorage.getItem("uid");
onAuthStateChanged(auth, user => {
  if (!user || user.uid !== localUser) {
    localStorage.clear();
    location.href = "login.html";
    return;
  }

  userRef = doc(db, "users", user.uid);

  onSnapshot(userRef, snap => {
    if (!snap.exists()) return;
    const u = snap.data();

    if (u.model !== "Earner") {
      alert("Unauthorized");
      location.href = "login.html";
      return;
    }

    username.textContent = u.username;
    email.textContent = u.email;
    phone.textContent = u.phone;
    model.textContent = u.model;
    balance.textContent = (u.balance || 0).toLocaleString();
    referralCount.textContent = u.referralCount || 0;

    profilePic.src = u.profilePic || "https://via.placeholder.com/120";

    bankName.value = u.bankDetails?.bankName || "";
    accountNumber.value = u.bankDetails?.accountNumber || "";
    accountName.value = u.bankDetails?.accountName || "";

    bio.value = u.bio || "";
    skills.value = u.skills || "";
  });
});

/* IMG BB UPLOAD */
window.uploadPic = async () => {
  const file = picInput.files[0];
  if (!file) return alert("Select image");

  showSpin();

  const formData = new FormData();
  formData.append("image", file);

  const res = await fetch("https://api.imgbb.com/1/upload?key=fb44bf17871e5949e02fe80b4f56fa47", {
    method: "POST",
    body: formData
  });

  const data = await res.json();
  await updateDoc(userRef, { profilePic: data.data.url });

  hideSpin();
  alert("Profile picture updated");
};

window.saveBank = async () => {
  showSpin();
  await updateDoc(userRef, {
    bankDetails: {
      bankName: bankName.value,
      accountNumber: accountNumber.value,
      accountName: accountName.value
    }
  });
  hideSpin();
  alert("Bank details updated");
};

window.saveProfessional = async () => {
  showSpin();
  await updateDoc(userRef, {
    bio: bio.value,
    skills: skills.value
  });
  hideSpin();
  alert("Professional details updated");
};
</script>

</body>
</html>
