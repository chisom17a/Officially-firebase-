<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Tasks - Advertiser</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial;background:#f4f6f8;margin:0}
header{background:#0d6efd;color:white;padding:15px;text-align:center;font-size:20px}
.container{max-width:1000px;margin:20px auto;padding:10px}
.card{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.row{margin:6px 0}
.btn{
  padding:9px 12px;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
  margin-right:5px;
}
.pause{background:#ffc107}
.resume{background:#28a745;color:white}
.visit{background:#0d6efd;color:white}
.details{background:#6f42c1;color:white}
.add{background:#20c997;color:white}
.loading{display:none;margin-top:10px}
.spinner{
  width:30px;height:30px;border:4px solid #eee;border-top:4px solid #111;border-radius:50%;
  animation:spin 1s linear infinite;margin:auto
}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>📢 My Posted Tasks</header>
<div class="container" id="list">Loading...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import {
  getFirestore, collection, query, where, getDocs,
  doc, getDoc, updateDoc, increment
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCajnnfI9oxVDv4B44tiMsIgTDApt1rFjc",
  authDomain: "chiearnhub-5ba9e.firebaseapp.com",
  projectId: "chiearnhub-5ba9e",
  storageBucket: "chiearnhub-5ba9e.firebasestorage.app",
  messagingSenderId: "332513744974",
  appId: "1:332513744974:web:bfb84a79d0dbbb0057cb1f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const list = document.getElementById("list");

onAuthStateChanged(auth, async user=>{
  if(!user) return location.href="login.html";

  const us = await getDoc(doc(db,"users",user.uid));
  if(!us.exists() || us.data().model !== "Advertiser"){
    alert("Access denied");
    return location.href="index.html";
  }

  loadTasks(user.uid);
});

async function loadTasks(uid){
  const q = query(collection(db,"availabletasks"), where("posterId","==",uid));
  const snap = await getDocs(q);

  if(snap.empty){
    list.innerHTML = "<b>You have not posted any tasks yet.</b>";
    return;
  }

  list.innerHTML = "";

  for(const d of snap.docs){
    const t = d.data();

    const div = document.createElement("div");
    div.className = "card";

    const status = t.paused ? "⏸ Paused" : "▶️ Running";

    div.innerHTML = `
      <div class="row"><b>Task:</b> ${t.platform} - ${t.type}</div>
      <div class="row"><b>Status:</b> ${status}</div>
      <div class="row"><b>Count:</b> ${t.total} / ${t.remaining}</div>

      <div style="margin-top:10px">
        <button class="btn visit">Visit</button>
        <button class="btn ${t.paused ? "resume":"pause"}">${t.paused ? "Resume":"Pause"}</button>
        <button class="btn add">Add Members</button>
        <button class="btn details">View Details</button>
      </div>

      <div class="loading">
        <div class="spinner"></div>
        Processing...
      </div>
    `;

    const visitBtn = div.querySelector(".visit");
    const toggleBtn = div.querySelector(".pause, .resume");
    const addBtn = div.querySelector(".add");
    const detailsBtn = div.querySelector(".details");
    const loading = div.querySelector(".loading");

    visitBtn.onclick = ()=> window.open(t.link, "_blank");

    toggleBtn.onclick = async ()=>{
      if(!confirm("Change task status?")) return;

      toggleBtn.style.display = addBtn.style.display = detailsBtn.style.display = visitBtn.style.display = "none";
      loading.style.display="block";

      await updateDoc(doc(db,"availabletasks", d.id), {
        paused: !t.paused
      });

      location.reload();
    };

    addBtn.onclick = async ()=>{
      const num = Number(prompt("How many members to add?"));
      if(!num || num < 1) return;

      if(!confirm("Add "+num+" members?")) return;

      toggleBtn.style.display = addBtn.style.display = detailsBtn.style.display = visitBtn.style.display = "none";
      loading.style.display="block";

      await updateDoc(doc(db,"availabletasks", d.id), {
        total: increment(num),
        remaining: increment(num)
      });

      location.reload();
    };

    detailsBtn.onclick = ()=>{
      location.href = "task-details.html?id=" + d.id;
    };

    list.appendChild(div);
  }
}
</script>
</body>
</html>
