<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Tasks - Advertiser</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial;background:#f4f6f8;margin:0}
header{background:#111;color:white;padding:15px;text-align:center;font-size:20px}
.container{max-width:1100px;margin:20px auto;padding:10px}

.card{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.row{margin:6px 0}

.badge{
  padding:4px 10px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.active{background:#d1fae5;color:#065f46}
.paused{background:#fee2e2;color:#991b1b}

.btn{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  margin-right:5px;
}

.pause{background:#f59e0b;color:white}
.resume{background:#16a34a;color:white}
.add{background:#0d6efd;color:white}
.visit{background:#6b7280;color:white}
.view{background:#111;color:white}
</style>
</head>
<body>

<header>📢 My Posted Tasks</header>
<div class="container" id="list">Loading...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import {
  getFirestore, collection, query, where, getDocs,
  doc, updateDoc, increment
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCajnnfI9oxVDv4B44tiMsIgTDApt1rFjc",
  authDomain: "chiearnhub-5ba9e.firebaseapp.com",
  projectId: "chiearnhub-5ba9e",
  storageBucket: "chiearnhub-5ba9e.firebasestorage.app",
  messagingSenderId: "332513744974",
  appId: "1:332513744974:web:bfb84a79d0dbbb0057cb1f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const list = document.getElementById("list");

onAuthStateChanged(auth, async user=>{
  if(!user) return location.href="login.html";

  loadTasks(user.uid);
});

async function loadTasks(uid){
  list.innerHTML = "Loading...";

  const q = query(collection(db,"tasks"), where("posterId","==",uid));
  const snap = await getDocs(q);

  if(snap.empty){
    list.innerHTML = "<b>You have not posted any tasks yet.</b>";
    return;
  }

  list.innerHTML = "";

  snap.forEach(d=>{
    const t = d.data();

    const div = document.createElement("div");
    div.className = "card";

    const statusBadge = t.status === "active"
      ? `<span class="badge active">Active</span>`
      : `<span class="badge paused">Paused</span>`;

    div.innerHTML = `
      <div class="row"><b>Platform:</b> ${t.platform}</div>
      <div class="row"><b>Type:</b> ${t.type}</div>
      <div class="row"><b>Reward:</b> ₦${t.earnerPrice}</div>
      <div class="row"><b>Status:</b> ${statusBadge}</div>
      <div class="row"><b>Count:</b> ${t.quantity} / ${t.remaining}</div>

      <div style="margin-top:10px">
        <button class="btn ${t.status==="active"?"pause":"resume"}">
          ${t.status==="active"?"Pause":"Resume"}
        </button>
        <button class="btn add">Add Members</button>
        <button class="btn visit">Visit</button>
        <button class="btn view">View Details</button>
      </div>
    `;

    const pauseBtn = div.querySelector(".pause, .resume");
    const addBtn = div.querySelector(".add");
    const visitBtn = div.querySelector(".visit");
    const viewBtn = div.querySelector(".view");

    // Pause / Resume
    pauseBtn.onclick = async ()=>{
      const newStatus = t.status === "active" ? "paused" : "active";
      if(!confirm(`Change status to ${newStatus}?`)) return;

      await updateDoc(doc(db,"tasks",d.id),{ status:newStatus });
      alert("Updated");
      loadTasks(auth.currentUser.uid);
    };

    // Add Members
    addBtn.onclick = async ()=>{
      const add = +prompt("How many members to add?");
      if(!add || add < 1) return;

      if(!confirm("Confirm adding "+add+" slots?")) return;

      await updateDoc(doc(db,"tasks",d.id),{
        quantity: increment(add),
        remaining: increment(add)
      });

      alert("Slots added");
      loadTasks(auth.currentUser.uid);
    };

    // Visit link
    visitBtn.onclick = ()=>{
      window.open(t.link, "_blank");
    };

    // View details
    viewBtn.onclick = ()=>{
      location.href = "advertiser-task-details.html?id=" + d.id;
    };

    list.appendChild(div);
  });
}
</script>

</body>
</html>
