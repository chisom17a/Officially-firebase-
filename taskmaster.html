<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Task Review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{font-family:Inter;background:#f4f7fa;margin:0}
header{background:#fff;padding:15px;font-size:22px;font-weight:700}
.container{max-width:1000px;margin:auto;padding:20px}
.card{background:#fff;padding:20px;margin-bottom:20px;border-radius:12px}
img{max-width:100%;border-radius:8px;margin-top:10px}
button{padding:10px 16px;border:none;border-radius:8px;font-weight:600;cursor:pointer}
.approve{background:#16a34a;color:#fff}
.reject{background:#dc2626;color:#fff}
.actions{display:flex;gap:12px;margin-top:15px}
.meta{font-size:14px;color:#555}
</style>
</head>

<body>

<header>Admin – Task Submissions</header>

<div class="container" id="taskContainer">Checking authorization…</div>

<script type="module">
/* ================= FIREBASE (chiearnhubvercel) ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import {
  getFirestore, collection, query, where, onSnapshot,
  doc, getDoc, updateDoc, increment, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* 🔥 CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCqHY59fXbXWTOtki5cBT-qryPVNerzToM",
  authDomain: "chiearnhubvercel.firebaseapp.com",
  projectId: "chiearnhubvercel",
  storageBucket: "chiearnhubvercel.firebasestorage.app",
  messagingSenderId: "1069350970788",
  appId: "1:1069350970788:web:b6fb81b6c397344d118d31"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const container = document.getElementById("taskContainer");

/* ================= LOCAL STORAGE CHECK ================= */
const storedUser = JSON.parse(localStorage.getItem("currentUser"));
if(!storedUser || storedUser.model !== "Admin"){
  alert("Please login as admin");
  location.href = "login.html";
}

/* ================= AUTH VERIFY ================= */
onAuthStateChanged(auth, async user=>{
  if(!user || user.uid !== storedUser.uid){
    localStorage.removeItem("currentUser");
    return location.href="login.html";
  }

  const adminSnap = await getDoc(doc(db,"users",user.uid));
  if(!adminSnap.exists() || adminSnap.data().model !== "Admin"){
    alert("Unauthorized");
    return location.href="login.html";
  }

  loadSubmissions();
});

/* ================= LOAD SUBMISSIONS ================= */
function loadSubmissions(){
  const q = query(
    collection(db,"adminTaskQueue"),
    where("status","==","pending")
  );

  onSnapshot(q, snap=>{
    container.innerHTML = "";

    if(snap.empty){
      container.innerHTML = "<p>No pending submissions</p>";
      return;
    }

    snap.forEach(docSnap=>{
      const s = docSnap.data();
      const id = docSnap.id;

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <h3>${s.platform} - ${s.type}</h3>

        <div class="meta">
          <b>User:</b> ${s.username || ""} (${s.userEmail})<br>
          <b>Reward:</b> ₦${s.reward}
        </div>

        <p><b>Text Proof:</b><br>${s.proofText}</p>
        ${s.proofImage ? `<img src="${s.proofImage}">` : ""}

        <div class="actions">
          <button class="approve">Approve</button>
          <button class="reject">Reject</button>
        </div>
      `;

      card.querySelector(".approve").onclick = () => approve(id, s);
      card.querySelector(".reject").onclick = () => reject(id);

      container.appendChild(card);
    });
  });
}

/* ================= APPROVE ================= */
async function approve(submissionId, sub){
  if(!confirm("Approve this submission?")) return;

  try{
    /* Credit user */
    await updateDoc(doc(db,"users",sub.userId),{
      balance: increment(sub.reward)
    });

    /* Update submission */
    await updateDoc(doc(db,"submissions",submissionId),{
      status:"approved",
      reviewedAt: serverTimestamp()
    });

    await updateDoc(doc(db,"adminTaskQueue",submissionId),{
      status:"approved",
      reviewedAt: serverTimestamp()
    });

    alert("✅ Approved & user credited");

  }catch(err){
    console.error(err);
    alert("❌ Failed to approve");
  }
}

/* ================= REJECT ================= */
async function reject(submissionId){
  const reason = prompt("Reason for rejection?");
  if(!reason) return;

  try{
    await updateDoc(doc(db,"submissions",submissionId),{
      status:"rejected",
      rejectionReason: reason,
      reviewedAt: serverTimestamp()
    });

    await updateDoc(doc(db,"adminTaskQueue",submissionId),{
      status:"rejected",
      rejectionReason: reason,
      reviewedAt: serverTimestamp()
    });

    alert("❌ Submission rejected");

  }catch(err){
    console.error(err);
    alert("❌ Failed to reject");
  }
}
</script>

</body>
</html>
